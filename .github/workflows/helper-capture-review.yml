name: Linux helper capture review (nonprivileged only)

# This route is deliberately separate from the mandatory installed-resource gate.
# Publishing this file does not contain the existing broad push/PR workflows.
# Do not dispatch until the event-containment prerequisite has been resolved.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify helper capture without elevation or fixture interpretation
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 tests/linux_desktop_helper_tests.py
          python3 scripts/check-linux-desktop.py --self-test
          python3 scripts/check-linux-desktop.py
          /bin/sh -n packaging/linux/install.sh
          /bin/sh -n packaging/linux/uninstall.sh
          /bin/sh -n packaging/linux/desktop-integration.sh
