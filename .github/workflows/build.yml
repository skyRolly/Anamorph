name: Build & Validate

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:
  # RH-PR-8: lets release.yml REUSE this exact build+validation matrix on a
  # release tag (single build, same gates, artifacts land in the caller run).
  # Purely additive -- branch/PR/dispatch behaviour is unchanged, and tag
  # pushes still do not trigger THIS workflow (the `branches` filter excludes
  # tag events); they trigger release.yml, which calls this one.
  workflow_call:

permissions:
  contents: read

# One in-flight run per ref. Pushing three times in ten minutes previously left
# three full 3-OS matrices racing, which is both wasteful and confusing to read:
# the Actions page shows three runs for one branch and only the newest describes
# the tip.
#
# cancel-in-progress is GUARDED ON THE REF rather than set to a bare `true`:
# this workflow is also reached through `workflow_call` from release.yml, and a
# release build must never be cancelled by an unrelated push. Tag refs therefore
# queue instead of cancelling.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# ---------------------------------------------------------------------------
# pluginval strictness lives in ONE place so raising or lowering the bar is a
# one-line edit. THIS BLOCK IS THAT PLACE. It replaces six literal `10`s spread
# across the three build jobs, which is six chances for a raise to land in five
# of them. The two documents that describe the gate defer to it and state no
# number of their own: docs/policies/TESTING_POLICY.md owns what the gate
# REQUIRES (suites, modes, passes, platforms) and docs/procedures/CI_CD.md owns
# how the pipeline is WIRED.
#
#     5    development bar
#     8    standard gate
#     10   pre-release gold standard -- REQUIRED, and in force here
#
# Lowering it below 10 is a deliberate act that must be justified in the PR.
#
# ---------------------------------------------------------------------------
# THE CLANG MAJOR VERSION IS PINNED, and for the same one-place reason.
#
# `linux` compares its diagnostics against `scripts/clang-warning-baseline.txt`,
# which records exact per-(path, flag) site counts. Which diagnostics Clang emits
# is a property of the COMPILER VERSION -- `-Wshadow-field`, `-Wsign-conversion`
# and `-Wunused-but-set-variable` all move between majors -- so an unpinned
# `clang` means the baseline's reference point is whatever `ubuntu-latest`
# happens to resolve to that week. A runner-image bump would then turn the gate
# red (or, worse, quietly green with fewer diagnostics) on a push that changed
# nothing in the tree. That is exactly the failure the baseline's
# "never key on line numbers" rule was written to avoid, reintroduced one level
# up.
#
# 22 IS AN UPSTREAM STABLE RELEASE, and since ADR-0033 that is ASSERTED rather
# than assumed: `setup-llvm-apt.sh` refuses to install a major whose upstream
# release identity it does not carry, and refuses the install if the compiler's
# build commit is not that release's tag commit. noble-22 is built from
# `ca7933e47d3a`, which IS `llvmorg-22.1.8^{}`. Ubuntu's own archives stop at 20
# for noble, so it comes from apt.llvm.org -- upstream's own channel, added by
# that script, which its header justifies in full. Ubuntu's packaging boundary is
# a fact about Ubuntu, not about this project, so it is not allowed to hold the
# warning gate -- and, since ADR-0030, the SHIPPED Linux compiler -- majors back.
#
# 23 IS NOT ADOPTED, and the reason is mechanical rather than editorial: LLVM
# 23.1.0 released 2026-08-25, but every apt.llvm.org `-23` suite still carries a
# build from 49 commits BEFORE that tag. ADR-0033 records the measurement, the
# blocker and the condition that lifts it; ADR-0028 decides the rule; CI_CD.md
# records the measurements.
#
# The baseline RECORDS this number in its own header and
# `check-clang-warnings.py` refuses to run when the two disagree: bumping the pin
# without re-baselining is then a loud, specific failure rather than a silent
# comparison against another compiler's output. Bump both in the same change,
# and read the baseline diff.
#
# `sanitizers` pins to the same major so its `libclang-rt-<n>-dev` is
# version-matched by construction instead of being derived from `clang --version`
# -- and, since Clang 21 dropped `vptr` from `-fsanitize=undefined`, so that the
# flag list can be stated against a known major (see that job).
#
# ---------------------------------------------------------------------------
# THE LINUX ARTIFACT IS CLANG'S. `linux` builds the shipped VST3 and Standalone
# with the pinned `clang-<n>` from apt.llvm.org, linked by the matching
# `lld-<n>` that `setup-llvm-apt.sh` installs beside it -- which is not a
# preference but a correctness requirement for the LTO archive link that
# CMakeLists.txt's lld block sets out in full. `merge-check` uses the same
# toolchain because it is the only build on the same-repo PR path.
#
# GCC IS THE COMPATIBILITY COMPILER and ships nothing. `linux-lto-tests` keeps
# the tree honest under the other major toolchain and gates the two GCC-only
# diagnostics below. Its pin is deliberately WEAKER than everything else here: a
# floating `gcc:16` tag, major only, so patch releases arrive without a commit.
# A checker wants the newest 16.x automatically; a shipping toolchain must not.
# That job's own block explains why an image rather than `apt` -- in short, no
# package source ships a RELEASED GCC 16 for any runner-available Ubuntu.
#
# `scripts/gcc-warning-baseline.txt` records the MAJOR and refuses to run
# against another, which is exactly the granularity the floating tag preserves.
#
# WHY GCC AT ALL, next to a Clang gate whose default warning set is strictly
# larger: "larger" is not "a superset". GCC sees two classes Clang structurally
# does not -- a parameter or local shadowing a member outside a constructor
# (`-Wshadow`; Clang's `-Wshadow-all` does not report it) and
# `-Wmisleading-indentation` (no Clang equivalent). Three such sites exist in
# this tree today and are recorded in the baseline as accepted debt; the gate is
# there so the NEXT one fails the push that introduces it. ADR-0029 records the
# decision; `scripts/check-gcc-warnings.py` carries the measurements and the
# reasoning for the two flags deliberately left OUT of the gated set.
#
# The gated FLAG SET is not restated here: the workflow asks the script for it
# (`--print-flags`), so the flags the build uses and the flags the gate knows
# about cannot drift apart.
# ---------------------------------------------------------------------------
env:
  ANAMORPH_PLUGINVAL_STRICTNESS: 10
  ANAMORPH_CLANG_VERSION: 22
  ANAMORPH_GCC_VERSION: 16

# Every push builds the FULL set of formats on all three desktop OSes so beta
# testers can install on any platform:
#   * Linux   -> VST3 + Standalone
#   * Windows -> VST3 + Standalone
#   * macOS   -> VST3 + AU + Standalone  (universal arm64 + x86_64)
#
# Validation is UNIFORM across all three platforms and BLOCKING on each:
# pluginval at the strictness above, run in two explicit modes -- deterministic
# and randomise -- each repeated 3 consecutive times (scripts/run-pluginval.sh on
# Linux/macOS, scripts/run-pluginval.ps1 on Windows). A non-zero pluginval exit
# fails the job on every platform (no continue-on-error / swallowed exit codes).
# Both mode steps ALWAYS run for a deterministic FAILURE: the randomise step is
# guarded with `if: !cancelled() && steps.build.outcome == 'success'` so a
# deterministic failure never SKIPS randomise -- both modes always report
# independently. The job still fails if either mode fails. The build clause is
# load-bearing: `!cancelled()` alone is true after ANY upstream failure, so
# without it a compile error let pluginval and the staging steps run against a
# tree with no plug-in in it, and the job's LAST error was a cascade
# ("expected exactly one Anamorph.vst3 bundle, found 0") rather than the compile
# error that caused it. Every step that consumes build output therefore names the
# step that PRODUCES what it consumes -- never a bare `!cancelled()`, and not
# always `build`: on Linux the pluginval gates validate the STRIPPED bytes, so
# there the producer is `strip` (which subsumes `build`, having no `if:` of its
# own). Windows and macOS have no such intermediate step, so `build` is the
# producer there.
#
# ON macOS THE AU IS VALIDATED TOO, and only there -- it is the one format that
# exists on exactly one platform, and it is the only format Logic and GarageBand
# load. Until this job existed the release gate ran against the VST3 alone on all
# three OSes, so the format most of this product's macOS users actually run
# shipped having passed no automated validation at all.
#
# ASYMMETRY, stated rather than glossed: ONLY LINUX validates the shipped bytes.
# Its strip step runs BEFORE pluginval, so the gate sees exactly what users get.
# On macOS `strip -x` + ad-hoc codesign happen in the packaging step AFTER
# pluginval, and on Windows the public copy is produced after validation too --
# so on those two platforms a defect introduced BY stripping or signing would
# ship unvalidated. Reordering is not free (macOS must codesign last, or the seal
# breaks), so it is recorded in docs/procedures/CI_CD.md rather than guessed at.
#
# Symbol handling (RH-PR-2, ADR-0021): every platform generates full debug
# info, retains it as a separate *-debug artifact (split .debug / PDB / dSYM)
# for crash symbolication, and ships STRIPPED public binaries. On macOS the
# dSYM capture is BEST-EFFORT: under Release+LTO the DWARF needed for dSYM
# reconstruction may no longer exist at packaging time (see the package
# step), in which case the -debug upload is skipped with a warning while the
# customer artifacts ship normally. On Linux the
# strip runs before pluginval so the release gate validates the shipped bytes.
# Customer uploads are gated on the DSP self-tests AND their strip/packaging
# steps SUCCEEDING (never `if: always()`), and the staging steps self-validate
# (no symbol table, no debug files in the public copy) -- neither a partial
# packaging failure nor a failed behavioural gate can ship a customer
# artifact. On macOS "the DSP self-tests" means BOTH slices of the universal
# binary: the native arm64 run and the x86_64 run under Rosetta are each a
# blocking condition on the customer uploads, because a slice that fails its
# behavioural gate is a defect in the product, not in the runner. Developer
# *-debug artifacts and (on pluginval-only failures) beta artifacts remain
# available.
#
# ---------------------------------------------------------------------------
# THE SAME-REPO PULL-REQUEST GUARD, carried by every job below.
#
#     if: github.event_name != 'pull_request' ||
#         github.event.pull_request.head.repo.full_name != github.repository
#
# `push: ["**"]` already builds every commit on every branch, so on a same-repo
# PR the `pull_request` event built the SAME SHA a second time -- a duplicate
# 3-OS matrix per commit for as long as the PR stayed open, plus a duplicate
# CodeQL-adjacent load on the runner pool. FORK pull requests are NOT covered by
# the push trigger (the push happens in the fork), so they still run: that is the
# only case the pull_request trigger uniquely serves here.
#
# THREE CONSEQUENCES, stated so none is discovered later:
#   * The push build and the `pull_request` build are NOT the same tree. `push`
#     builds the branch TIP; `pull_request` builds `refs/pull/N/merge`, the tip
#     merged with the CURRENT base. A PR green on its own tip can be broken once
#     the base moves under it, and skipping every job here left that unbuilt
#     until the merge landed on the default branch. `merge-check` below is the
#     answer: it is the exact complement of this guard, runs ONLY on a same-repo
#     PR, and builds and self-tests the merge commit. It deliberately does not
#     re-run packaging, pluginval or the other two platforms -- those validate
#     properties of the TIP, which the push build already covered, and
#     duplicating them is what this guard exists to avoid.
#   * On a same-repo PR the jobs carrying this guard report as SKIPPED in the
#     PR's checks list. They can still be required status checks, but only if the
#     branch protection accepts a skipped conclusion as passing -- the same SHA
#     was already built on the branch push. `merge-check` is the one check that
#     actually RUNS there, so it is the one to require if only one can be.
#   * Inside a reusable workflow `github.event_name` reflects the CALLER's event.
#     release.yml -- this repository's only caller -- triggers on a tag `push` and
#     on `workflow_dispatch`, never on `pull_request`, so the guard is TRUE on
#     every release and every rehearsal run and all jobs execute. THAT CHECK HAS
#     BEEN MADE, against the caller as it stands. It would stop holding the moment
#     a `pull_request:` trigger were added to release.yml (or build.yml were
#     called from any PR-triggered workflow): do not add one without revisiting
#     this guard. Unlike a `needs:`-gated arrangement the failure mode is a
#     MISSING check rather than a green run that built nothing -- no job here
#     gates on another job's output.
#
# ---------------------------------------------------------------------------
# THE COMPILER CACHE, carried by every job below that uses the Ninja generator.
#
# MEASURED, not assumed. On the Linux Release build (4 cores, the runner's core
# count) `.ninja_log` splits a cold build of 7m41s into 1409 CPU-seconds of
# compilation (75%) and 468 CPU-seconds of LTO link (25%), and the compilation
# is almost all JUCE: 9k lines of first-party source against a framework that
# every one of the three JUCE-linking targets compiles separately. JUCE is
# pin-locked to an immutable commit (CMakeLists.txt:83-89, ADR-0022/0026), so
# that 75% is byte-identical from run to run and recompiling it every push is
# the single largest piece of avoidable work in this pipeline.
#
# ccache, not sccache: sccache's advantage is a shared/distributed object store,
# which needs a bucket and a credential this repository does not have and should
# not grow for a build this size; against GitHub's cache both are local-disk
# caches and ccache is the one already packaged for every image here.
#
# WHY THIS IS SAFE, stated plainly because "cache" and "release gate" in one
# sentence deserves it: ccache's own hash is the correctness boundary, not the
# cache key below. It hashes the preprocessed source, the full command line
# (every -D, -I, -f and -arch), and -- via compiler_check=content -- the bytes
# of the compiler binary itself. A GitHub cache key can therefore only ever
# cost a HIT; it cannot manufacture a wrong one. That is why the key here is
# deliberately COARSE and does not hash CMakeLists.txt: a key that changes on
# every CMake edit would throw the cache away for no correctness gain that
# ccache is not already providing.
#
# Two properties of this repository make it work, and both are load-bearing:
#   * The build directory name is FIXED per job (`build`, `build-lto`,
#     `build-san`, `build-vg`). JUCE is fetched by FetchContent INTO the build
#     directory, so its path appears in the -I flags of every compile; a build
#     directory that changed name between runs would miss 100% of the time.
#     This was measured the hard way -- the same tree built at two different
#     directory names shares nothing.
#   * No definition on the command line varies per run. Until this change
#     ANAMORPH_BUILD_NUMBER did: it is ${{ github.run_number }}, it was a
#     target-wide definition, and the two targets carrying it are 84.4% of
#     compile time. Every push therefore missed on 84.4% of the build because an
#     About-box string had incremented. It is now attached to the one
#     translation unit that reads it (CMakeLists.txt, set_source_files_properties
#     next to the version block), which is what makes this optimization worth
#     anything at all.
#
# Warnings survive a cache hit -- ccache replays the compiler's stderr verbatim,
# caret lines and [-Wflag] included. That is not incidental here: `linux`
# gates on the diagnostic text of its build, and a cache that swallowed warnings
# would turn that gate green by deleting its input. Verified against the pinned
# Clang before this was enabled.
#
# NOT on `windows`: that job uses the multi-config Visual Studio generator, and
# ccache's MSVC support requires /Z7-style embedded debug info, while this
# project deliberately compiles Release with /Zi so the linker emits the PDB
# that ships as the crash-symbolication artifact (CMakeLists.txt, MSVC block).
# Trading that artifact for build time is not a trade this pipeline should make,
# and Windows is not the critical path (12m49s against macOS's 29m44s).
#
# Each cached job zeroes the stats at configure time and prints them after the
# build, so the hit rate is visible per run rather than inferred. A cold cache
# is not a failure -- it is what the first run on a new lineage looks like.
#
# AND NEITHER IS AN ABSENT ONE. Required tools fail loudly; the cache warns and
# steps aside. That rule is not decoration -- it was briefly broken here, in the
# direction that matters most. `brew install ninja ccache || true` followed by a
# bare `ccache --version` swallowed a genuine Homebrew failure (network, tap,
# formula conflict) and then converted it into a hard failure one line later, on
# a job that gates a release. Ninja is PREINSTALLED on the macOS images, so
# before that change brew was not load-bearing at all: a hiccup cost nothing and
# the job built with the ninja already on the box. Making Homebrew's uptime a
# release dependency, to obtain a thing whose own documentation calls it an
# optimization, is the wrong trade in every direction.
#
# So each job resolves the launcher instead of assuming it: the install step
# writes `ANAMORPH_COMPILER_LAUNCHER` to $GITHUB_ENV -- `ccache` when it is
# genuinely there, empty when it is not -- and the configure step passes that
# through to `CMAKE_<LANG>_COMPILER_LAUNCHER`.
#
# ON LINUX THAT RULE NOW HAS ONE COPY, not seven:
# `.github/actions/setup-linux-build` is a composite action carrying it, and the
# seven Linux jobs call it with at most two inputs (a pinned Clang major, extra
# apt packages). Its header says why. The two macOS jobs still write the block
# out, because `brew` and `apt` are different enough that a shared action would
# be a conditional pretending to be a step; the LINEAGE keys stay in this file
# in every case, since those are the part that genuinely differs per job. An empty launcher is how CMake
# spells "no launcher", so the fallback is an ordinary compiler invocation:
# slower, never different. The statistics step is gated on the same variable so
# it reports nothing rather than failing, and `--zero-stats` is explicitly
# non-fatal because the default `run:` shell is `bash -e` and a missing ccache
# would otherwise fail the configure step it is only bookkeeping for.
# The statistics step is guarded the same way and for a sharper version of the
# same reason: it is pure reporting, and a non-zero exit from it (an older
# ccache without `--verbose`, say) would fail the job and then silently skip
# stripping, staging and every upload, since the steps after it default to
# `success()`. A footnote to an optimization must not decide whether a
# release ships.
# ---------------------------------------------------------------------------

jobs:
  # -------------------------------------------------------------------------
  # THE MERGE RESULT -- the one tree no push build ever compiles.
  #
  # `actions/checkout` on a `pull_request` event checks out `refs/pull/N/merge`,
  # so this job builds the PR merged with the base as it stands right now. That
  # is the tree the merge button produces, and nothing else in this workflow
  # sees it: every other job is skipped on a same-repo PR because the push
  # trigger already built the same SHA -- the TIP, not the merge.
  #
  # SCOPED TO SAME-REPO PRs, the exact complement of the guard above. A fork PR
  # is not covered by the push trigger, so it already runs the full matrix here
  # and does not need this. Under `workflow_call` the caller's event decides:
  # release.yml triggers on a tag push and workflow_dispatch, so this job is
  # skipped on every release and rehearsal, which is correct -- a tag has no
  # merge result.
  #
  # BUILD AND SELF-TESTS ONLY, and that is the whole design. What a moved base
  # breaks is compilation and behaviour, and both are platform-independent:
  # a semantic merge conflict fails here. Packaging, pluginval and the other two
  # platforms validate properties of the tip that the push build already gated,
  # so re-running them would restore the duplicate matrix the guard removed. No
  # artifacts are produced: this job answers "does the merge build and pass",
  # not "what would we ship".
  # -------------------------------------------------------------------------
  merge-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE SAME PINNED CLANG AS `linux`, and for this job's whole reason to
      # exist: it is the only build on the same-repo PR path, so if it compiled
      # with the host's default compiler it would clear PRs against a toolchain
      # the project does not ship -- and the first build with the shipped one
      # would be the merge.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANAMORPH_CLANG_VERSION }}

      # SHARES A CACHE LINEAGE WITH `linux` -- same pinned Clang, same Release
      # configuration, same `build` directory name, same targets. The two jobs
      # never run in the same event (this one is same-repo-PR-only, that one is
      # everything else), so on a PR this restores the cache the last push to
      # main wrote. That is the whole reason this job is worth caching: it is
      # the ONLY build on the same-repo PR path, so its build step is that
      # path's entire critical path.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-clang${{ env.ANAMORPH_CLANG_VERSION }}-release-${{ github.run_id }}
          restore-keys: ccache-ubuntu-clang${{ env.ANAMORPH_CLANG_VERSION }}-release-

      - name: Configure
        run: |
          ccache --zero-stats || true
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${{ env.ANAMORPH_CLANG_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.ANAMORPH_CLANG_VERSION }} \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + Standalone + tests)
        run: cmake --build build --config Release

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      - name: DSP + state self-tests
        env:
          MALLOC_PERTURB_: 1        # fresh heap = 0xFE; see the `linux` job's self-test step
        run: ./scripts/run-tests.sh

  # -------------------------------------------------------------------------
  # Documentation structure lint (scripts/check-docs.py).
  #
  # Deliberately NOT a dependency of the build jobs: a prose defect should fail
  # the run, not skip a binary that is otherwise fine. It costs seconds on the
  # cheapest runner and needs no toolchain.
  #
  # `--self-test` runs FIRST and is the load-bearing half. In the sibling product
  # this checker once reported the repository "50 file(s) clean" while an
  # unclosed fence exempted 1382 lines of its largest document from every check,
  # so "the script exited 0" is not evidence unless the script's own guarantees
  # were exercised in the same run. Both commands are plain `python3` invocations
  # with no dependencies beyond the standard library.
  # -------------------------------------------------------------------------
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint documentation structure
        run: |
          python3 scripts/check-docs.py --self-test
          python3 scripts/check-docs.py

  # -------------------------------------------------------------------------
  # Source portability lint + evidence-anchor gate.
  #
  # THE PORTABILITY LINT EXISTS BECAUSE A BUILD JOB CANNOT REPLACE IT. An
  # explicit template argument on `juce::jmin/jmax/snapToZero` instantiates
  # juce_dsp's dsp::SIMDRegister overload, and completing that class needs
  # SIMDNativeOps<T> -- which exists only where T names one of JUCE's ten SIMD
  # element typedefs. On Linux glibc `uint64_t` IS `unsigned long` IS `size_t`,
  # so `juce::jmax<size_t>(...)` completes; on macOS libc++ `uint64_t` is
  # `unsigned long long`, so it does not and the translation unit fails to
  # compile. The divergence is in the TYPEDEF, not the front end, so NO Linux
  # compiler can see it -- adding the Linux+Clang job below would NOT catch it.
  # A lint is the only Linux-runnable guard, which is why it is a separate,
  # seconds-long job rather than a step inside a build. This tree is clean of it
  # today; the job is a regression guard, and the sibling product lost three days
  # of red macOS builds to the one line it guards.
  #
  # No `needs:` -- a source defect should fail the run on its own terms, not wait
  # behind a toolchain.
  # -------------------------------------------------------------------------
  source-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `check-citations.py` compares against a BASE REVISION, so the run
          # needs history rather than the default single-commit checkout.
          fetch-depth: 0
      # PROVE THE GATE IS LIVE BEFORE TRUSTING ITS SILENCE (TESTING_POLICY rule
      # 4): the self-test runs in THIS job, immediately before the lint it
      # verifies, and needs nothing but Python. It runs the real stripper and the
      # real pattern over source that must fire and source that must stay quiet,
      # then the real `lint()` over a temporary tree, then the real scratch-name
      # comparison — so a dead regex, an over-eager stripper, a walker that
      # reaches no files or a coupling check that always agrees fails HERE rather
      # than reporting the tree clean.
      #
      # It is NOT the same check as `--compile-canary` in `linux`, and the
      # two are not interchangeable. That one asks whether the PINNED JUCE still
      # has the hazard — a question about the dependency, answerable only where
      # JUCE is checked out. This asks whether the CHECKER still finds it. A
      # green canary with a broken scanner reports a clean tree; a green
      # self-test with a changed JUCE guards a hazard that has moved. Both are
      # required, and only this one can run beside the lint.
      - name: Portability lint self-test (the lint still fires, and still stays quiet)
        run: python3 scripts/check-portability.py --self-test

      - name: Lint source portability (JUCE SIMD overload hazard)
        run: python3 scripts/check-portability.py

      # THE STATIC HALF OF THE REALTIME STRATEGY (ADR-0029). RTSan and the
      # allocation guard both enforce REALTIME_AUDIO_POLICY at RUNTIME and are
      # strictly better where they apply -- they follow real calls through JUCE
      # and through templates. They share one blind spot: a runtime tool sees
      # only the code the suite EXECUTES, and the DSP suite covers 93.4% of
      # lines / 79.9% of branches in `src/dsp`. This lint reads the branches the
      # suite never takes, costs no build, and runs on every platform.
      # Function-scoped on purpose: `prepare()` is REQUIRED to allocate, so a
      # file-wide token scan would flag the eight legitimate `setSize` calls in
      # `AnamorphEngine.cpp` and get switched off.
      - name: Realtime lint self-test (the lint still fires, and still stays quiet)
        run: python3 scripts/check-realtime.py --self-test

      - name: Lint audio-path bodies (REALTIME_AUDIO_POLICY forbidden constructs)
        run: python3 scripts/check-realtime.py

      # Same rule, and this checker needs it MOST: the other three only report,
      # while this one REWRITES governed documents under `--fix`. A defect here
      # does not merely fail to catch drift — it replaces a correct anchor with a
      # wrong one and prints success, which it has done four times (a `rev:`
      # qualifier reaching the ownership test, a compound citation left
      # internally contradictory, one span applied twice, a provenance sentence
      # wrapping the sibling's range). Each is a case in the self-test, in the
      # direction it failed. It runs on synthetic input through the real
      # functions, so it needs no base revision and cannot be satisfied by a
      # clean tree.
      - name: Citation-gate self-test (recognition, mapping and rewriting)
        run: python3 scripts/check-citations.py --self-test

      # THE TOOLCHAIN INSTALLER'S VERIFIER, self-tested HERE rather than in the
      # five jobs that install: its decision function needs no apt, no network
      # and no compiler, so proving it live costs seconds in a lint job instead
      # of five duplicated minutes in build jobs. The install path calls the same
      # function with real evidence, so a dead verifier fails here rather than
      # accepting whatever the mirror served. It covers the case that used to
      # pass silently -- a compiler whose version looks right and whose identity
      # cannot be established from any source (ADR-0033).
      - name: Release-identity self-test (the toolchain verifier still refuses)
        run: ./scripts/setup-llvm-apt.sh --self-test

      # Evidence anchors (`some/file.cpp:695-752`) are exact and
      # therefore fragile: an edit ABOVE one silently re-aims it at unrelated
      # code while the document keeps reading as though it were still correct.
      # The example deliberately names a path OUTSIDE `TRACKED`: this file is
      # itself a tracked path now, so the checker scans it, and it cannot tell
      # an illustration of an anchor from an anchor -- spelled with a governed
      # path this sentence would become a rewrite target and `--fix` would
      # change the very numbers it exists to talk about. That is the rule the
      # checker's own header states, applied to the file that describes it.
      # DOCUMENTATION_LIFECYCLE_POLICY.md already requires anchors to be
      # re-anchored in the SAME change set that moves them; this is that rule as
      # a gate, over the 184 anchors `docs/` carried when it landed.
      #
      # WHAT IT COMPARES AGAINST, precisely:
      #
      #   * pull_request -- FORK pull requests only (this job carries the
      #     same-repo guard above, so a same-repo branch never reaches this event
      #     here; do not read this branch as the normal case). `base.sha` is fed
      #     through `git merge-base`. On this event `actions/checkout` checks out
      #     the GENERATED MERGE COMMIT (`refs/pull/N/merge`), whose first parent
      #     IS `base.sha`, so `merge-base` returns `base.sha` verbatim and the hop
      #     is a no-op. It is kept because it is the correct expression of the
      #     intent and stops being a no-op the moment the checkout names the PR
      #     head instead -- not because it is doing work today.
      #   * push -- the normal path, and the one that holds the line.
      #     `event.before` is the branch's previous tip, so each push is judged
      #     against its immediate predecessor: ONE PUSH OF DRIFT AT A TIME. That
      #     is narrower than a merge base and still sufficient, because every
      #     push is checked -- which is why this job has no `needs:` and cannot be
      #     skipped by a failing build.
      #
      # Two ways `event.before` is unusable, both tested for below: on the first
      # push of a branch it is all-zeros, and after a FORCE-PUSH it names a commit
      # the repository may no longer have at all -- `git show` then fails every
      # file and the script reports "nothing to check against" and exits 2, a red
      # gate that says nothing about the documents. Both fall back to `HEAD~1`
      # with a notice, which under-checks rather than failing on a question it
      # cannot answer.
      - name: Check documentation evidence anchors
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # A merge base exists only when the two share history; a force-push
            # that rewrote the fork point can leave them disjoint.
            BASE="$(git merge-base "$BASE" HEAD 2>/dev/null || echo "$BASE")"
          else
            BASE=''
          fi
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            echo "::notice::No usable base revision for this event; falling back to $BASE"
          fi
          echo "Comparing evidence anchors against $BASE"
          python3 scripts/check-citations.py --check --base "$BASE"

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # THE PINNED CLANG BUILDS THE SHIPPED BYTES. `setup-llvm-apt.sh` verifies
      # the apt.llvm.org signing key by fingerprint and installs `clang-<n>`,
      # `lld-<n>` and `libclang-rt-<n>-dev` together, so the linker that resolves
      # the LTO archive is version-matched to the compiler by construction --
      # which is the property CMakeLists.txt's lld block depends on.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANAMORPH_CLANG_VERSION }}

      # Shared lineage with `merge-check` -- see that job. This is the writer of
      # the two: it runs on every push, so the cache a PR restores is the one
      # the last push to the base branch left behind.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          # THE COMPILER IS IN THE KEY. `CCACHE_COMPILERCHECK: content` already
          # makes a different compiler miss rather than collide, so this is
          # about eviction, not correctness: a lineage shared between two
          # compilers holds two full sets of objects in one 500M budget and the
          # two evict each other. The major is spelled here so that changing the
          # pin starts a clean lineage instead of thrashing the old one.
          key: ccache-ubuntu-clang${{ env.ANAMORPH_CLANG_VERSION }}-release-${{ github.run_id }}
          restore-keys: ccache-ubuntu-clang${{ env.ANAMORPH_CLANG_VERSION }}-release-

      - name: Configure
        run: |
          ccache --zero-stats || true
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-${{ env.ANAMORPH_CLANG_VERSION }} \
            -DCMAKE_CXX_COMPILER=clang++-${{ env.ANAMORPH_CLANG_VERSION }} \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      # ABSORBED FROM THE FORMER `linux-clang` JOB, which built the same targets
      # with the same compiler in a second build directory purely because this
      # job used to be GCC's. Now that the shipped build IS the Clang build,
      # keeping both would have been one full Release compile of duplicated
      # infrastructure -- so the two steps that were genuinely `linux-clang`'s
      # own moved here instead.
      #
      # The canary belongs where the pinned JUCE is already on disk, which is
      # this job now. It asserts the hazard `source-lint` guards is still real
      # for the pinned revision -- deduced form must compile, explicit form must
      # not -- so a JUCE bump that changes the SIMDRegister overload set fails
      # here rather than silently turning the lint into a no-op.
      - name: Portability compile canary (pinned JUCE still has the hazard)
        run: >
          python3 scripts/check-portability.py --compile-canary build/_deps/juce-src/modules
          --cxx clang++-${{ env.ANAMORPH_CLANG_VERSION }}

      # PROVE THE GATE IS LIVE BEFORE TRUSTING ITS SILENCE -- a checker that has
      # stopped matching anything is indistinguishable from a clean tree. Run
      # before the build so a broken classifier fails in seconds rather than
      # after the full compile.
      - name: Warning-gate self-test (the classifier still classifies)
        run: python3 scripts/check-clang-warnings.py --self-test

      # THE LOG IS KEPT because this job now carries the first-party warning
      # gate that `linux-clang` used to run in a second, near-identical Clang
      # build. The gate itself runs LATE, after the artifact upload -- see that
      # step for why.
      - name: Build (VST3 + Standalone + tests)
        id: build
        run: |
          set -o pipefail
          cmake --build build --config Release 2>&1 | tee clang-build.log

      # A cache hit changes where the .o files came from, never what they
      # contain, so the link is fed identical input and the `strip` step below
      # is unaffected. Note what that step actually reads: `objcopy
      # --only-keep-debug` operates on the LINKED `.so`/executable, not on the
      # objects, so object provenance could not reach it in the first place.
      # (macOS is the case where provenance genuinely matters -- `dsymutil`
      # walks the debug map back to the object files; see that job's note.)
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      # RH-PR-2 (ADR-0021): capture split debug info, then strip the shipped
      # binaries. Runs BEFORE pluginval so the release gate validates the
      # exact stripped bytes users receive. --strip-unneeded keeps .dynsym
      # (the VST3 entry points hosts resolve); the .debug files carry the full
      # symbol/debug info for crash symbolication and ship as a SEPARATE
      # artifact, never inside the public one.
      - name: Extract debug symbols + strip shipped binaries
        id: strip
        run: |
          set -e
          SO="build/Anamorph_artefacts/Release/VST3/Anamorph.vst3/Contents/x86_64-linux/Anamorph.so"
          APP="build/Anamorph_artefacts/Release/Standalone/Anamorph"
          # NEVER MAKE THIS DIR A DESCENDANT OF THE PUBLIC ONE. The invariant is
          # about PATH ANCESTRY, not string prefixes: "dist/Anamorph-Linux" IS a
          # string prefix of "dist/Anamorph-Linux-debug" today and that is fine,
          # because `upload-artifact` treats `path: dist/Anamorph-Linux` as a
          # literal directory and `find "$DIST"` descends only that directory --
          # neither matches by prefix. What would break is a rename to a nested
          # layout (dist/Anamorph-Linux/debug), which puts the .debug files inside
          # the uploaded tree AND inside the leak-checked tree at once: shipped
          # symbols, or a failing leak check, depending on the pattern.
          DBG="dist/Anamorph-Linux-debug"
          mkdir -p "$DBG"
          objcopy --only-keep-debug "$SO"  "$DBG/Anamorph.vst3.so.debug"
          objcopy --only-keep-debug "$APP" "$DBG/Anamorph.standalone.debug"
          strip --strip-unneeded "$SO"
          strip --strip-unneeded "$APP"
          # objcopy stores only the BASENAME of the argument in .gnu_debuglink
          # (bfd's bfd_fill_in_gnu_debuglink_section passes it through
          # lbasename), and a debugger resolves that name relative to the
          # STRIPPED BINARY'S OWN directory, then .debug/, then the global debug
          # dir. Passing "$DBG/<file>.debug" therefore stores exactly the same
          # string as the form below; both were measured to produce a
          # byte-identical section. This form is written from inside $DBG so the
          # stored name is the one spelled at the call site rather than one the
          # reader has to know lbasename produces; it is NOT a behavioural
          # difference. The binary paths are made absolute because the working
          # directory changes.
          SO_ABS="$(readlink -f "$SO")"; APP_ABS="$(readlink -f "$APP")"
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anamorph.vst3.so.debug    "$SO_ABS" )
          ( cd "$DBG" && objcopy --add-gnu-debuglink=Anamorph.standalone.debug "$APP_ABS" )
          # Verify the strip: no static symbol table left, and the plugin must
          # still export its VST3 entry point from .dynsym.
          for BIN in "$SO" "$APP"; do
            if readelf -S "$BIN" | grep -q '\.symtab'; then
              echo "::error::$BIN still carries a .symtab after strip"; exit 1
            fi
          done
          nm -D "$SO" | grep -q GetPluginFactory
          # Written LAST, so it is set only if every objcopy/strip/verify above
          # succeeded. The debug upload gates on it rather than on "the step was
          # not skipped": $DBG is created at the top of this step, so an abort
          # part-way through would otherwise leave a directory that exists but may
          # be empty, and the upload would fail a SECOND time on if-no-files-found
          # -- burying the real error under a cascade.
          echo "debug_artifacts=true" >> "$GITHUB_OUTPUT"

      # MALLOC_PERTURB_ FILLS FRESH HEAP WITH A NON-ZERO PATTERN and freed heap
      # with a different one. Linux hands back zero-filled pages and macOS does
      # not, so a read-before-write in DSP state is benign here and arbitrary
      # there -- the symptom is platform-specific while the DEFECT is not. This
      # makes the Linux run behave like the hostile allocator for free: no
      # rebuild, no instrumentation, no measurable slowdown.
      #
      # THE VALUE IS NOT THE FILL BYTE, and getting that backwards is why this
      # said 255 for one round. glibc applies the variable ASYMMETRICALLY:
      #
      #     alloc_perturb (p, n)  ->  memset (p, perturb_byte ^ 0xff, n)
      #     free_perturb  (p, n)  ->  memset (p, perturb_byte,        n)
      #
      # so the FRESH-allocation fill is the COMPLEMENT of the value. 255 was
      # chosen to write 0xFF into fresh buffers and did the exact opposite: it
      # wrote 0x00, which is the benign zero-fill this step exists to defeat.
      # Measured, not inferred -- with 255 a fresh 4 KiB buffer reads
      # `00 00 00 00` and so does a recycled one, making the setting strictly
      # WORSE than leaving it unset (unset, a recycled chunk reads back real
      # garbage such as `20 3b 40 ce`).
      #
      # 1 gives fresh = 0xFE and freed = 0x01. A float built from 0xFEFEFEFE is
      # -1.69e38, near the negative end of the float range: an uninitialised read
      # of audio state is then enormous AND wrong-signed, so every level, null,
      # transparency and click-free assertion in both suites fails on it.
      #
      # NaN IS NOT AVAILABLE HERE, so the earlier claim could not have held at any
      # value. A float whose four bytes are all B has exponent
      # ((B & 0x7f) << 1) | (B >> 7), which is 0xFF only for B = 0xFF -- and
      # fresh = 0xFF needs perturb_byte = 0, which is glibc's "perturbation off"
      # sentinel. Swept all 255 selectable values to confirm: 254 give a loud
      # finite float, 255 gives zero, none gives NaN, Inf or a denormal. NaN
      # coverage is what the `sanitizers` job is for.
      #
      # glibc-only, which is why it is set here and on `linux` and NOT on
      # the macOS job, where libmalloc ignores it and the variable would read as
      # coverage that does not exist. valgrind in `sanitizers` answers the same
      # question more thoroughly and far more slowly; this is the cheap one, on
      # every push.
      - name: DSP + state self-tests
        id: tests
        env:
          MALLOC_PERTURB_: 1
        run: ./scripts/run-tests.sh

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must
        # have succeeded for the binary to be in the state we intend to validate.
        # On Linux `strip` is that step, and it subsumes the build: strip carries
        # no `if:`, so a failed build leaves it 'skipped'. It runs BEFORE
        # validation so the gate sees the exact stripped bytes users receive.
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} deterministic vst3

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is
        #     what `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists.
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} randomise vst3

      # Customer-artifact safety (RH-PR-2 review): staging and upload are
      # gated on the strip step having SUCCEEDED — never `if: always()` — so
      # an unstripped binary cannot reach the public artifact if stripping
      # fails. `!cancelled()` (not plain success()) keeps the beta artifact
      # available when only pluginval failed. The staging step additionally
      # self-validates the artifact it just built: no .symtab, no debug files.
      - name: Stage Linux artifacts (VST3 + Standalone)
        id: stage
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anamorph-Linux"
          mkdir -p "$DIST"
          cp -R build/Anamorph_artefacts/Release/VST3/Anamorph.vst3 "$DIST/"
          cp    build/Anamorph_artefacts/Release/Standalone/Anamorph "$DIST/Anamorph"
          cp    packaging/linux/INSTALL.txt "$DIST/INSTALL.txt"
          install -m 755 packaging/linux/install.sh   "$DIST/install.sh"
          install -m 755 packaging/linux/uninstall.sh "$DIST/uninstall.sh"
          # Attribution/support files (NOTICE, THIRD_PARTY_LICENSES.md,
          # SUPPORT.md) are deliberately NOT staged: the packages carry only
          # what a user needs to install, and INSTALL.txt is installation-only
          # since 2026-07-26. They ship as version-named release-page assets
          # (release.yml), which are therefore the SOLE carrier of the
          # mandatory IJG acknowledgement -- RELEASE_POLICY forbids publishing
          # a release without them.
          # The customer artifact must contain no symbol table and no debug files.
          while IFS= read -r -d '' ELF; do
            if readelf -S "$ELF" 2>/dev/null | grep -q '\.symtab'; then
              echo "::error::customer artifact contains an unstripped binary: $ELF"; exit 1
            fi
          done < <(find "$DIST" -type f \( -name 'Anamorph*' -o -name '*.so' \) -print0)
          # No `-type f`: a .dSYM is a DIRECTORY, so `-type f` would make that arm
          # permanently dead and the check would read stronger than it is. Linux
          # produces no dSYMs, but the macOS step calls its own copy "parity with
          # the Linux/Windows staging self-checks" -- so it has to be parity.
          if find "$DIST" \( -name '*.debug' -o -name '*.pdb' -o -name '*.dSYM' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # ONE artifact ships from this validated staging dir: Anamorph-Linux
          # uploads the staged FILES themselves, so the zip GitHub serves for
          # the artifact contains the payload directly -- extract once, no
          # wrapper folder, no nested archive. The artifact transport does NOT
          # preserve Unix file modes; INSTALL.txt covers that for the per-push
          # route (sh install.sh / chmod +x), and release.yml restores the
          # executable bits before archiving the published release zip, behind
          # its own fail-closed self-check.

      # A failed DSP self-test blocks the CUSTOMER upload (fail-closed: only a
      # build that passed its behavioural gate may ship), while a
      # pluginval-only failure still yields beta artifacts as before.
      - name: Upload Linux artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-Linux
          path: dist/Anamorph-Linux
          if-no-files-found: error

      # Developer debug artifacts are preserved even when a LATER step fails
      # (they never contain customer-facing binaries) -- but only when the strip
      # step itself completed, which is what actually produced the .debug files.
      - name: Upload Linux debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.strip.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-Linux-debug
          path: dist/Anamorph-Linux-debug
          if-no-files-found: error

      # THE COMPATIBILITY CLAIM, MEASURED. A Linux binary records, per imported
      # symbol, the oldest glibc/libstdc++ version providing it; the MAXIMUM of
      # those is the oldest system the artifact can load on at all -- below it
      # the dynamic loader refuses before a line of this project's code runs.
      # Nothing chooses that number: it falls out of whatever the runner image
      # ships. Until this step, nothing reported it either, so the project's
      # Linux compatibility claim was "it builds on ubuntu-latest", which is a
      # statement about CI rather than about users. It is GLIBC_2.38 today, which
      # is Ubuntu 23.10+ -- the artifact does not load on Ubuntu 22.04 LTS, and
      # that was decided by a runner-image move rather than by anyone here.
      #
      # LAST STEPS IN THE JOB, for the reason the `macos` dSYM assertion is: the
      # floor is raised by the ENVIRONMENT, not by this repository's code. A
      # runner-image move is precisely the trigger for which withholding the
      # evidence is least useful -- and asserting between the strip and the
      # self-tests did exactly that, because `steps.tests` would be 'skipped' and
      # both uploads gate on it being 'success'. A silent image change would have
      # produced a red run with no DSP/state result, no plug-in and no debug
      # symbols: nothing to diagnose the very thing that broke. Now the suites
      # run, pluginval runs, the artifacts are staged and uploaded, and THEN the
      # floor is judged.
      #
      # IT IS NO LESS MANDATORY FOR BEING LAST. `release.yml` depends on this
      # workflow's AGGREGATE result (`needs: [validate, build]`), which a failed
      # job decides wherever in the job it failed, so release eligibility is
      # unchanged -- only the artifacts' survival is. Nothing downstream reads
      # these steps' outcome, so moving them weakens no other gate.
      #
      # Gated on the STRIP step, because that is whose output they read: the
      # check is deliberately against the exact stripped bytes users receive, and
      # if stripping failed those bytes do not exist. The self-test stays
      # immediately before the check it verifies (TESTING_POLICY rule 4).
      # The floor lives in the script, and COMPATIBILITY_MATRIX defers to it
      # rather than restating a number.
      - name: ABI floor self-test (the checker still fires)
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: python3 scripts/check-linux-abi.py --self-test

      - name: Assert the shipped Linux ABI floor
        if: ${{ !cancelled() && steps.strip.outcome == 'success' }}
        run: |
          python3 scripts/check-linux-abi.py \
            "build/Anamorph_artefacts/Release/VST3/Anamorph.vst3/Contents/x86_64-linux/Anamorph.so" \
            "build/Anamorph_artefacts/Release/Standalone/Anamorph"

      # WHY A FIRST-PARTY CLANG WARNING GATE AT ALL, and why it lives on the
      # shipping job now. `juce_recommended_warning_flags` picks its set by
      # COMPILER ID, and Clang's is strictly larger than GCC's --
      # -Wshorten-64-to-32, -Wconditional-uninitialized, -Wsign-conversion,
      # -Wcast-align, -Wshift-sign-overflow, -Wzero-as-null-pointer-constant,
      # -Wimplicit-int-float-conversion. While GCC built the artifact those
      # diagnostics reached the project only from a second job, or from the
      # macOS runner minutes into a universal build. NOT HYPOTHETICAL: the
      # 2026-08-15 image move (macos-14/AppleClang 15 -> macos-latest/
      # AppleClang 21) surfaced four PRE-EXISTING
      # -Wimplicit-int-float-conversion sites in src/PluginEditor.cpp,
      # src/gui/LookAndFeel.cpp and src/dsp/VelvetNoise.cpp that had been in the
      # tree for months (CI_CD.md §Build matrix). They are now the SHIPPING
      # compiler's diagnostics, emitted by the build that produces the artifact.
      # It does NOT catch the typedef-divergence class -- see `source-lint`. Two
      # different gaps, two different guards; conflating them is how the second
      # one gets dropped.
      #
      # Coverage is complete from this job's targets: the test targets compile
      # the entire first-party tree (ANAMORPH_PLUGIN_SOURCES is shared with
      # AnamorphStateTests by construction, and AnamorphDSP is an INTERFACE
      # library whose sources compile into every consumer), and `Anamorph_VST3`
      # is the target that links `juce_recommended_lto_flags` -- a defect the
      # optimiser only acts on at -flto is invisible to every non-LTO artefact,
      # and -flto is what users install.
      #
      # IT IS A NO-NEW-WARNINGS GATE, NOT A ZERO-WARNINGS ONE, and that is not a
      # softening. The tree already carries 17 first-party Clang warning sites
      # (-Wshadow-field, -Wshadow, -Wswitch-enum, -Wsign-conversion,
      # -Wfloat-equal, -Wunused-but-set-variable, -Wmissing-prototypes), all
      # older than the gate; clearing them means renaming a member across the
      # editor, adding cases to engine switches and changing float comparisons in
      # DSP code -- source work that belongs in its own review under DSP_POLICY,
      # not in a CI change. The two alternatives are worse: a job that lands RED
      # teaches everyone to ignore it, and a job that cannot fail is not a gate.
      # So the accepted set is pinned in `scripts/clang-warning-baseline.txt` (a
      # debt list keyed on path+flag with a site count -- never on line numbers,
      # which drift on unrelated edits) and ANYTHING ABOVE IT fails. A count that
      # falls is a ::notice:: asking for the baseline to shrink, never a failure.
      #
      # THE FIRST-PARTY WARNING GATE, RUN LAST FOR THE REASON THE ABI GATE IS:
      # a validation finding should not withhold the beta artifact that the
      # behavioural gates already passed, so the upload happens above and this
      # still fails the job. Classification is STRUCTURAL rather than textual --
      # every diagnostic's path is resolved (absolute as-is, relative against
      # the build dir the compiler ran in) and asked whether it lands under
      # src/ or tests/ without passing through a `_deps` component. This build
      # emits TWO spellings of one file (src/dsp/ScopeBuffer.h and
      # src/gui/../dsp/ScopeBuffer.h) which the resolver folds into one baseline
      # key and a text match would not. `--clang-major` is checked against the
      # version recorded IN scripts/clang-warning-baseline.txt: a mismatch exits
      # 2 ("the check could not run"), never 1 ("the tree regressed").
      - name: Gate first-party Clang warnings
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 scripts/check-clang-warnings.py \
            --log clang-build.log \
            --root "${GITHUB_WORKSPACE}" \
            --build-dir "${GITHUB_WORKSPACE}/build" \
            --clang-major "${ANAMORPH_CLANG_VERSION}"

      # THE TWO COMMITTED INSTRUMENTS, COMPILED BY THE COMPILER THAT SHIPS.
      # `tests/bench.cpp` and `tests/dsp_dump.cpp` are built and run in
      # `linux-lto-tests`, which is a `gcc:16` container -- so until this step
      # they were the only first-party translation units in the tree that NO
      # Clang job compiled, and a Clang-only break in either reached no gate at
      # all. Neither is in a release build (both sit behind OFF-by-default
      # options), which is exactly why the gap was easy to miss.
      #
      # `-fsyntax-only`: no codegen, no link, no run -- measured at ~2 s for the
      # pair against the already-fetched JUCE headers, which is why this is a
      # step here rather than two more CMake configures. The GCC side keeps the
      # part this cannot do: `linux-lto-tests` LINKS and RUNS them.
      #
      # The defines mirror the two targets' own `target_compile_definitions`
      # (CMakeLists.txt) rather than being invented here; `-I build/_deps/...`
      # is the FetchContent'd JUCE this job already configured, the same source
      # the portability canary reads.
      #
      # RUN LAST, for the reason the ABI gate and the warning gate are: a
      # compile finding in an opt-in instrument must not withhold a beta
      # artifact whose behavioural gates all passed.
      - name: The opt-in instruments still compile under the shipped Clang
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -eu
          for TU in tests/bench.cpp tests/dsp_dump.cpp; do
            echo "clang -fsyntax-only $TU"
            clang++-${{ env.ANAMORPH_CLANG_VERSION }} -std=c++23 -O2 \
              -I src -I src/dsp -I build/_deps/juce-src/modules \
              -DJUCE_GLOBAL_MODULE_SETTINGS_INCLUDED=1 -DJUCE_STANDALONE_APPLICATION=1 \
              -DJUCE_WEB_BROWSER=0 -DJUCE_USE_CURL=0 \
              -Werror=unknown-warning-option -fsyntax-only "$TU"
          done

  # -------------------------------------------------------------------------
  # Sanitizers (Linux). The point of this job is to catch, ON LINUX, defects that
  # only MANIFEST on another platform.
  #
  # Memory that Linux hands back zero-filled is arbitrary on macOS, so an
  # uninitialised read of DSP state is benign here and poisonous there. That
  # defect class is platform-INDEPENDENT even though its symptom is not, and
  # tooling sees it regardless of which bytes the allocator happened to supply.
  # This repository ships a realtime audio processor with per-block state across
  # eight DSP stages and had no sanitizer coverage of any kind before this job.
  #
  # ASan+UBSan cover out-of-bounds, lifetime and undefined behaviour -- the last
  # of which also matters because UB is what lets -O3 + LTO on a different target
  # legally delete a guard. MemorySanitizer, the dedicated uninitialised-read
  # tool, is deliberately NOT used: it requires every dependency including libc++
  # and all of JUCE to be instrumented, and an uninstrumented dependency produces
  # false positives rather than silence. valgrind memcheck answers the same
  # question with no rebuild of anything, so it carries that half.
  #
  # valgrind runs BOTH suites. It is ~50x slower than native, and that cost is
  # accepted because memcheck is the only uninitialised-read detector in the
  # pipeline and the read that would matter runs through the real wrapper
  # `processBlock` -- which only AnamorphStateTests drives. Pointing it at the DSP
  # suite alone would aim the detector away from the wrapper entirely.
  #
  # detect_leaks=1 -- LeakSanitizer IS a gate here now (maintainer decision,
  # 2026-08-18). The claim that used to justify switching it off -- JUCE
  # singleton teardown producing spurious reports -- was retested and is simply
  # not true on clang 22 / JUCE 9.0.1: both suites run leak-CLEAN, 160 + 900
  # checks, zero LeakSanitizer reports. Leaving it off was costing real coverage
  # for a reason that had expired.
  #
  # If a future JUCE upgrade reintroduces exit-order reports, the response is to
  # investigate the report, not to reach for detect_leaks=0 again: a leak in the
  # plug-in and a leak in a dependency's teardown look different in the stack,
  # and this repository has no suppression file precisely so that the difference
  # has to be looked at. (The `fuzz` job runs with detect_leaks=0 for a specific,
  # documented reason of its own -- it leaks one JUCE initialiser on purpose.)
  # halt_on_error=1 on UBSan so the first violation fails the job rather than
  # scrolling past.
  #
  # NOT in any `needs:` chain and not a dependency of anything INSIDE this
  # workflow: it is slower than the build jobs, and a sanitizer finding should
  # not withhold a per-push beta artifact that the behavioural gates passed --
  # the packaging jobs upload theirs regardless of what happens here.
  #
  # THAT IS A STATEMENT ABOUT THIS WORKFLOW ONLY, and the release path differs.
  # `release.yml` calls this whole workflow as ONE job (`build:`), and
  # `draft-release` is `needs: [validate, build]` -- so a called workflow's
  # aggregate result is what that edge sees, and a failure HERE does skip the
  # draft release. That is the intended reading of RELEASE_POLICY's "the
  # existing `build.yml` gates are reused unchanged", not an accident; do not
  # infer release non-blocking from the absence of a `needs:` edge here.
  # -------------------------------------------------------------------------
  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Larger than the single-build jobs: this job compiles the two console
      # targets TWICE -- once instrumented, once clean for valgrind -- and the
      # two sets of objects share no cache entries (different flags, different
      # build directory), so one lineage here holds two builds' worth.
      CCACHE_MAXSIZE: 800M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The SAME pinned Clang major as `linux` (see the env block). This job
      # has no baseline to protect, but the pin buys something concrete here too:
      # clang's sanitizer runtime ships SEPARATELY from clang on Debian/Ubuntu,
      # and without it the link fails with "cannot find libclang_rt.asan-x86_64.a",
      # which reads as a project problem and is not one. The package is
      # version-suffixed, so the unpinned form had to DERIVE the major by
      # scraping `clang --version` and fall back to an unsuffixed alias that does
      # not exist on every image. With the major known up front the runtime is
      # named directly and a missing one fails loudly instead of silently taking
      # the fallback path (`set -e` is on).
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANAMORPH_CLANG_VERSION }}
          extra-packages: valgrind

      # Its own lineage, keyed on the pinned Clang major as `linux`'s is:
      # sanitized objects carry -fsanitize=address,undefined,vptr in the command line
      # ccache hashes, so a shared lineage could not CONFUSE the two jobs -- it
      # would just have them evict each other, and a moved pin orphans both.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-sanitizers-clang${{ env.ANAMORPH_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-sanitizers-clang${{ env.ANAMORPH_CLANG_VERSION }}-

      # `vptr` IS SPELLED OUT, and it is coverage PRESERVED rather than added.
      # Clang 21 removed `vptr` from the `-fsanitize=undefined` group, so the
      # bare `address,undefined` this job used to carry silently stopped checking
      # bad downcasts and bad vtables the moment the pin passed 20 -- verified by
      # running the same bad-downcast program under both majors: clang-20
      # reported it from `undefined` alone, clang-22 reported nothing until
      # `vptr` was named. It needs RTTI, which this project never disables.
      # C++ FLAGS ONLY, and do not "fix" the asymmetry: `vptr` is an RTTI check,
      # so it is dead on the 19 vendored C TUs this job compiles (a C TU emits
      # the same `__ubsan` count with and without it). clang-22 accepts it there
      # silently, but the driver hard-errors on `vptr` + `-fno-rtti` even in C,
      # and this job fails CLOSED at configure time. ADR-0028 has the evidence.
      #
      # THE FIVE GROUPS AFTER `vptr` are outside `undefined` and were added after
      # a measured census (2026-08-18, clang 22.1.8): both suites run ZERO
      # diagnostics under all five, so they gate for free. The full `integer`
      # group is DELIBERATELY absent -- its `unsigned-integer-overflow` half
      # flags legal, intentional wraparound and the census caught exactly that:
      # juce_String.cpp (hash multiply), juce_Random.cpp (LCG), juce_Thread.cpp
      # (tick arithmetic) and libstdc++'s mersenne twister, which under
      # `halt_on_error=1` would fail the job on correct third-party code. Its
      # non-redundant siblings (`implicit-*`, `unsigned-shift-base`) are named
      # individually instead; everything else in `integer` is already inside
      # `undefined`. One sharp edge, demonstrated: `local-bounds` is TRAP-based
      # -- a hit whose overlapping `array-bounds` check does not also fire dies
      # by SIGILL with NO diagnostic text, so a red run here with a bare
      # "Illegal instruction" needs a debugger on the failing binary, not a
      # scroll through the log.
      - name: Configure (Clang, ASan + UBSan + vptr)
        run: >
          ccache --zero-stats || true &&
          cmake -B build-san -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-divide-by-zero,implicit-conversion,unsigned-shift-base,local-bounds,nullability -fsanitize-ignorelist=${{ github.workspace }}/scripts/ubsan-ignorelist.txt -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined,vptr,float-divide-by-zero,implicit-conversion,unsigned-shift-base,local-bounds,nullability -fsanitize-ignorelist=${{ github.workspace }}/scripts/ubsan-ignorelist.txt -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined,vptr,float-divide-by-zero,implicit-conversion,unsigned-shift-base,local-bounds,nullability"
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DANAMORPH_BUILD_STANDALONE=OFF
          -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      # Only the two console targets. They compile the whole first-party tree and
      # do NOT link juce_recommended_lto_flags (that is on the plugin alone), so
      # they sanitize cleanly and quickly; a sanitized LTO plugin link would cost
      # far more for the same source coverage.
      - name: Build test targets (sanitized)
        run: cmake --build build-san --target AnamorphTests AnamorphStateTests

      # The three ASan runtime checks after detect_leaks were measured clean on
      # both suites (2026-08-18) and only ever tighten the gate.
      # detect_stack_use_after_return is NOT listed: it is the pinned Clang's
      # Linux default (`ASAN_OPTIONS=help=1` reads "Current Value: true", re-read
      # on both 22 and 23; a restated default is the copy that rots).
      - name: Self-tests under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:check_initialization_order=1:strict_init_order=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build-san/AnamorphTests_artefacts/RelWithDebInfo/AnamorphTests
          ./build-san/AnamorphStateTests_artefacts/RelWithDebInfo/AnamorphStateTests

      # Uses an UNSANITIZED Release build on purpose: memcheck and ASan
      # instrument the same memory and running them together is neither faster
      # nor more sensitive. This is the only uninitialised-read detector in the
      # pipeline (see the MemorySanitizer note above), so its exit code is the
      # gate: --error-exitcode makes a reported error fail the job, which is not
      # valgrind's default.
      # `-DANAMORPH_NO_ALLOC_GUARD` compiles the audio-path allocation guard out of
      # THIS build only. memcheck tracks which allocator produced each block and
      # intercepts the new/delete and malloc/free families separately, so the
      # guard's `operator new` -> `std::malloc` pairing reads as "Mismatched
      # free() / delete / delete []" on every later delete -- measured against
      # this exact suite, where it fails the step outright. The guard's own test
      # detects that it is absent and says so with a `::warning::` instead of
      # reporting a zero nothing was watching for; every other Linux job asserts
      # the invariant normally. (ADR-0029 section 7.)
      - name: Configure + build both suites (unsanitized, for valgrind)
        run: |
          cmake -B build-vg -G Ninja -DCMAKE_BUILD_TYPE=Release -DANAMORPH_BUILD_STANDALONE=OFF \
            -DCMAKE_CXX_FLAGS="-DANAMORPH_NO_ALLOC_GUARD" \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          cmake --build build-vg --target AnamorphTests AnamorphStateTests

      # Reported once, after BOTH builds -- the two share a lineage and the
      # useful number is what the job as a whole avoided recompiling.
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      # ANAMORPH_TESTS_NO_FTZ=1 relaxes ONE assertion in the DSP suite, and only
      # under this tool. `juce::ScopedNoDenormals` sets the CPU's FTZ/DAZ bits so
      # a denormal result is flushed to zero in hardware; valgrind emulates
      # floating point and does not honour those bits, so denormals survive into
      # the output and "engine output free of NaN/Inf/denormals" fails on a build
      # that is correct on every real CPU. Measured: memcheck reports ZERO errors
      # on that same run -- the tool finds no defect and the test fails anyway.
      # NaN and Inf remain failures here; only the denormal half is relaxed, and
      # only for this step. Every native job asserts the full check, so the
      # DSP_POLICY invariant is still gated on every push on every platform.
      # `tests/dsp_tests.cpp` carries the reasoning at the variable itself.
      - name: valgrind memcheck (both suites)
        env:
          ANAMORPH_TESTS_NO_FTZ: 1
        run: |
          VG="valgrind --tool=memcheck --track-origins=yes --leak-check=no
              --error-exitcode=1 --error-limit=no --num-callers=25"
          $VG ./build-vg/AnamorphTests_artefacts/Release/AnamorphTests
          $VG ./build-vg/AnamorphStateTests_artefacts/Release/AnamorphStateTests

  windows:
    runs-on: windows-latest
    # No compiler cache here -- see the compiler-cache block above the jobs for
    # why (/Zi is required for the PDB artifact and ccache's MSVC mode is not).
    timeout-minutes: 45
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default Visual Studio generator (multi-config); MSVC is auto-detected.
      - name: Configure
        id: configure
        run: cmake -B build -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      - name: DSP + state self-tests
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Exactly ONE match -- like the staging step below, and like
          # scripts/run-tests.sh. NOT `Select-Object -First 1`, which is what this
          # step used to do: Windows uses the multi-config Visual Studio
          # generator, so a tree ever built in more than one configuration holds
          # several AnamorphTests.exe, and taking whichever enumerates first could
          # run a Debug binary while the uploaded artifacts come from Release -- a
          # green gate reporting on the wrong build.
          function Get-OneTestExe {
            param([Parameter(Mandatory)][string]$Name)
            # -ErrorAction SilentlyContinue for the same reason as
            # scripts/run-pluginval.ps1: $ErrorActionPreference is 'Stop', so a
            # missing build/ would make Get-ChildItem THROW and the intended
            # "build first" message below would be unreachable -- the operator
            # would get a .NET stack trace instead of the one-line fix. In CI this
            # step only runs after a successful build, so it is a diagnostics gap
            # rather than a functional one; it is fixed for consistency, because
            # two discovery sites behaving differently is what invites the next bug.
            $found = @(Get-ChildItem -Recurse -Path build -Filter $Name -File -ErrorAction SilentlyContinue)
            if ($found.Count -eq 0) { Write-Error "$Name not found under build -- build first" }
            if ($found.Count -ne 1) {
              Write-Error ("$Name is ambiguous -- found " + $found.Count + ": " + ($found.FullName -join ', ') +
                           " -- refusing to guess which one the gate should run")
            }
            return $found[0]
          }
          # Locate BOTH before running either, so an ambiguous tree fails before any
          # test output invites a partial reading.
          $exe = Get-OneTestExe -Name AnamorphTests.exe
          $stateExe = Get-OneTestExe -Name AnamorphStateTests.exe
          $ErrorActionPreference = 'Continue'
          & $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $stateExe.FullName

      - name: pluginval (deterministic x3 -- release gate)
        # Explicit condition rather than relying on "no `if:`, so it self-skips".
        # Both pluginval steps carry the SAME condition, naming exactly what must
        # have succeeded for the binary to be worth validating.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} -Mode deterministic

      - name: pluginval (randomise x3 -- release gate)
        # Same condition as the deterministic step above -- deliberately NOT
        # `!cancelled()` alone. Two different things are being separated:
        #   * a DETERMINISTIC pluginval failure must never skip randomise (that is
        #     what `!cancelled()` buys, and it still holds);
        #   * an earlier PIPELINE failure must skip BOTH, because nothing worth
        #     validating exists -- a compile error otherwise produced a "not found
        #     -- build first" line that read like the cause and buried the real one.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: ./scripts/run-pluginval.ps1 -Strictness ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} -Mode randomise

      # RH-PR-2 (ADR-0021): Release now links with /DEBUG (+/OPT:REF,ICF), so
      # linker PDBs exist for the shipped images. They are retained as a
      # SEPARATE debug artifact for crash symbolication and are actively
      # removed from the public artifact.
      #
      # Customer-artifact safety (RH-PR-2 review): the order below is
      # deliberate -- locate everything BEFORE copying anything, purge every
      # debug file from the public copy IMMEDIATELY after the copy, and only
      # then run steps that can abort (PDB retention, validation). A failure
      # at any point can therefore never leave a symbol-bearing public
      # artifact behind, and the upload below is additionally gated on this
      # step's own checkpoint output.
      #
      # RH-PR-2 follow-up (CI reliability): the original PDB retention
      # assumed the linker drops each image's PDB in the SAME directory as
      # the shipped binary, named after it. Neither holds for this
      # JUCE/CMake/MSVC layout -- JUCE retargets RUNTIME/LIBRARY_OUTPUT_DIRECTORY
      # to place the shipped .vst3/.exe at their final bundle location, but
      # PDB_OUTPUT_DIRECTORY is never set, so the linker's /PDB: default falls
      # back to the target's own CMake binary directory under $(TargetName),
      # e.g. Anamorph_VST3.pdb -- a different name in a different directory,
      # which is what CI observed as "found 0". Rather than guess a new fixed
      # path (fragile the same way), the PDB is now identified from the
      # authoritative source: the CodeView (RSDS) debug-directory record MSVC
      # embeds in the linked image itself, which carries the PDB's exact
      # link-time name and path. That recorded path is tried directly first
      # (valid within the same job/workspace that built it); if it does not
      # resolve, a scoped search under build/ for that EXACT recorded
      # filename is used, still requiring precisely one match -- this is
      # anchored to linker-recorded ground truth, not a guessed pattern, so
      # it is not the "tree-wide substring matching" this replaces.
      - name: Stage Windows artifacts (VST3 + Standalone; PDBs separated)
        id: stage_windows
        # Gated on the build, like Linux's staging is via steps.strip: `!cancelled()` alone is true
        # after a compile error, and this step then failed with "expected exactly one Anamorph.vst3
        # bundle, found 0" -- the LAST error in the log and a completely misleading one. It stays
        # !cancelled() rather than plain success() so a pluginval failure still stages a beta artifact.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = 'dist/Anamorph-Windows'
          $dbg  = 'dist/Anamorph-Windows-debug'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          New-Item -ItemType Directory -Force -Path $dbg  | Out-Null

          # Read the CodeView (RSDS) debug-directory record MSVC embeds in a
          # /DEBUG-linked PE image, returning the PDB path exactly as the
          # linker recorded it (or $null if the image carries no debug
          # directory at all). This is the ground truth for where the PDB
          # actually is -- not an assumption about co-location or naming.
          function Get-EmbeddedPdbPath {
            param([Parameter(Mandatory)][string]$ImagePath)
            $bytes = [System.IO.File]::ReadAllBytes($ImagePath)
            if ($bytes.Length -lt 0x40 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              Write-Error "$ImagePath is not a valid PE image (missing MZ signature)"
            }
            # EVERY offset below is read OUT OF the image being parsed, so each one
            # is bounds-checked before it is used as an index. Without that, a
            # truncated or malformed file throws a raw .NET IndexOutOfRangeException
            # instead of the diagnosable Write-Error this function is written to
            # produce -- and the operator gets a stack trace where a one-line cause
            # was intended. Diagnostics quality, not correctness: these images come
            # from MSVC in this same job.
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            # 26, not 24, and the two bytes matter: this ONE guard covers every
            # read between here and the next check, so it has to cover the
            # LARGEST of them, not the offset of the last one. Those reads are
            # the PE signature (peOffset+0..1), NumberOfSections (peOffset+6..7),
            # SizeOfOptionalHeader (peOffset+20..21) and the optional header's
            # Magic (peOffset+24..25) -- 4 for the signature, 20 for the COFF
            # file header, then 2 for Magic. At exactly +24 or +25 the earlier
            # bound admitted the file and `ToUInt16($bytes, $optHeaderOffset)`
            # then threw the raw .NET IndexOutOfRangeException this function
            # exists to replace with a diagnosable message.
            if ($peOffset -lt 0 -or ($peOffset + 26) -gt $bytes.Length) {
              Write-Error "$ImagePath : e_lfanew ($peOffset) points outside the file, or leaves fewer than 26 bytes (PE signature + COFF header + optional-header Magic) of $($bytes.Length) -- image is truncated or malformed"
            }
            if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) {
              Write-Error "$ImagePath is not a valid PE image (missing PE signature)"
            }
            $coffOffset = $peOffset + 4
            $numberOfSections = [BitConverter]::ToUInt16($bytes, $coffOffset + 2)
            $sizeOfOptionalHeader = [BitConverter]::ToUInt16($bytes, $coffOffset + 16)
            $optHeaderOffset = $coffOffset + 20
            $magic = [BitConverter]::ToUInt16($bytes, $optHeaderOffset)
            $dataDirOffset = $optHeaderOffset + $(if ($magic -eq 0x20B) { 112 } else { 96 })
            $debugEntryOffset = $dataDirOffset + (6 * 8)   # data-directory index 6 = Debug
            if (($debugEntryOffset + 8) -gt $bytes.Length) {
              Write-Error "$ImagePath : optional header / data directories run past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugRva  = [BitConverter]::ToUInt32($bytes, $debugEntryOffset)
            $debugSize = [BitConverter]::ToUInt32($bytes, $debugEntryOffset + 4)
            if ($debugRva -eq 0 -or $debugSize -eq 0) { return $null }
            # Map the debug directory's RVA to a file offset via the section table.
            $sectionTableOffset = $optHeaderOffset + $sizeOfOptionalHeader
            if (($sectionTableOffset + ($numberOfSections * 40)) -gt $bytes.Length) {
              Write-Error "$ImagePath : section table ($numberOfSections sections at $sectionTableOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            $debugFileOffset = -1
            for ($i = 0; $i -lt $numberOfSections; $i++) {
              $s = $sectionTableOffset + ($i * 40)
              $vsize = [BitConverter]::ToUInt32($bytes, $s + 8)
              $vaddr = [BitConverter]::ToUInt32($bytes, $s + 12)
              $rawPtr = [BitConverter]::ToUInt32($bytes, $s + 20)
              if ($debugRva -ge $vaddr -and $debugRva -lt ($vaddr + [Math]::Max($vsize, 1))) {
                $debugFileOffset = $rawPtr + ($debugRva - $vaddr); break
              }
            }
            if ($debugFileOffset -lt 0) {
              Write-Error "$ImagePath : could not map the debug directory RVA to a file offset"
            }
            # Walk the IMAGE_DEBUG_DIRECTORY array (28 bytes/entry) for an
            # IMAGE_DEBUG_TYPE_CODEVIEW (2) entry carrying an RSDS record.
            $entryCount = [Math]::Floor($debugSize / 28)
            if (($debugFileOffset + ($entryCount * 28)) -gt $bytes.Length) {
              Write-Error "$ImagePath : debug directory ($entryCount entries at $debugFileOffset) runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
            }
            for ($i = 0; $i -lt $entryCount; $i++) {
              $e = $debugFileOffset + ($i * 28)
              $type = [BitConverter]::ToUInt32($bytes, $e + 12)
              $pointerToRaw = [BitConverter]::ToUInt32($bytes, $e + 24)
              if ($type -eq 2 -and $pointerToRaw -gt 0) {
                # Bounds-check before indexing: PointerToRawData comes from the
                # image being parsed, so a truncated or malformed file would
                # otherwise throw a raw .NET IndexOutOfRange instead of the
                # intended, diagnosable Write-Error. 28 = Signature(4) + GUID(16)
                # + Age(4), then at least one path byte.
                if ($pointerToRaw + 28 -gt $bytes.Length) {
                  Write-Error "$ImagePath : CodeView record at offset $pointerToRaw runs past the end of the file ($($bytes.Length) bytes) -- image is truncated or malformed"
                }
                $sig = [BitConverter]::ToUInt32($bytes, $pointerToRaw)
                if ($sig -eq 0x53445352) {   # 'RSDS'
                  # Signature(4) + GUID(16) + Age(4), then a NUL-terminated path.
                  $strStart = $pointerToRaw + 24
                  $strEnd = $strStart
                  while ($strEnd -lt $bytes.Length -and $bytes[$strEnd] -ne 0) { $strEnd++ }
                  return [System.Text.Encoding]::ASCII.GetString($bytes, $strStart, $strEnd - $strStart)
                }
              }
            }
            return $null
          }

          # 1) Locate everything first -- abort here copies NOTHING public.
          #    Each locate demands EXACTLY ONE match: zero is a build-layout
          #    failure, more than one is ambiguity we refuse to guess about.
          # -ErrorAction SilentlyContinue: see the self-test step -- a missing build/
          # must produce the diagnostic below, not a terminating .NET error.
          $vst3 = @(Get-ChildItem -Recurse -Path build -Filter Anamorph.vst3 -Directory -ErrorAction SilentlyContinue)
          if ($vst3.Count -ne 1) { Write-Error "expected exactly one Anamorph.vst3 bundle, found $($vst3.Count)" }
          $vst3 = $vst3[0]
          $vst3Bin = @(Get-ChildItem -Recurse -Path $vst3.FullName -File | Where-Object { $_.Extension -eq '.vst3' })
          if ($vst3Bin.Count -ne 1) { Write-Error "expected exactly one .vst3 image inside $($vst3.FullName), found $($vst3Bin.Count)" }
          $vst3Bin = $vst3Bin[0]
          $exe = @(Get-ChildItem -Recurse -Path build -Filter Anamorph.exe -ErrorAction SilentlyContinue | Where-Object { $_.Directory.Name -eq 'Standalone' })
          if ($exe.Count -ne 1) { Write-Error "expected exactly one Standalone Anamorph.exe, found $($exe.Count)" }
          $exe = $exe[0]
          # 2) Copy the public artifact.
          Copy-Item -Recurse -Force $vst3.FullName $dist
          Copy-Item -Force $exe.FullName $dist
          Copy-Item -Force packaging/windows/INSTALL.txt $dist
          # Attribution/support files are NOT staged (packages carry only what
          # a user needs to install; INSTALL.txt is installation-only). They
          # ship as version-named release-page assets, the SOLE carrier of the
          # mandatory IJG acknowledgement -- RELEASE_POLICY forbids publishing
          # a release without them.
          # 3) Purge ALL debug material from the public copy BEFORE any
          #    further step that can abort.
          Get-ChildItem -Recurse -Path $dist -File |
            Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' } |
            Remove-Item -Force
          # 4) Validate the PUBLIC copy and CHECKPOINT it. Everything the customer
          #    artifact needs is done at this point, so `public_ok` is emitted HERE,
          #    before the developer-side PDB work below can abort. $GITHUB_OUTPUT is
          #    read after the step regardless of its outcome, so a later failure
          #    cannot retract it. Previously the customer upload AND the installer
          #    gated on this whole step succeeding, which meant a purely
          #    developer-side symbol problem ALSO withheld the Windows beta
          #    artifact and its installer, even though the public copy was already
          #    assembled and purged -- while macOS treats the same class of failure
          #    as best-effort. The two platforms had opposite policies for one
          #    situation; this is the macOS policy, applied here.
          #    WHAT THIS CHECK IS, PRECISELY: it re-lists the same extensions step 3
          #    just deleted, so it can only fire if Remove-Item silently failed. That
          #    is a DELETE-CONFIRMATION, not an independent property check, and it is
          #    weaker than the Linux equivalent (which inspects ELF section headers
          #    for .symtab and asserts the stripped .so still exports
          #    GetPluginFactory) and than macOS (which asserts both slices are
          #    present). Nothing here asserts the shipped .vst3 is still loadable.
          #    Do NOT substitute a raw byte-string search for `GetPluginFactory`:
          #    matching the name anywhere in the file is not evidence that it is
          #    exported. The honest way to close it is to read the PE export table,
          #    which this step already has the machinery for.
          $leak = Get-ChildItem -Recurse -Path $dist -File |
                  Where-Object { $_.Extension -in '.pdb', '.ilk', '.exp', '.debug' }
          if ($leak) { Write-Error ("customer artifact contains debug files: " + ($leak.FullName -join ', ')) }
          "public_ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          # 5) Retain each shipped image's linker PDB (abort here is now
          #    leak-safe), identified via its embedded CodeView record rather
          #    than an assumed name/location (see follow-up note above).
          #    DELIBERATELY STRICT, unlike the macOS dSYM capture: there, a missing
          #    dSYM is an EXPECTED consequence of Release+LTO; here /DEBUG
          #    guarantees a PDB, so its absence means the build or this logic is
          #    wrong and must be seen. The strictness now costs only the -debug
          #    artifact, which is what it is actually protecting.
          foreach ($img in @(@{ tag = 'vst3'; bin = $vst3Bin }, @{ tag = 'standalone'; bin = $exe })) {
            $recordedPdbPath = Get-EmbeddedPdbPath -ImagePath $img.bin.FullName
            if (-not $recordedPdbPath) {
              Write-Error ("no CodeView debug-directory entry embedded in " + $img.bin.FullName +
                           " -- expected one because Release links with /DEBUG (CMakeLists.txt AnamorphHardening); " +
                           "debug artifact would be wrong/incomplete")
            }
            $pdbName = Split-Path -Leaf $recordedPdbPath
            $pdbFile = $null
            if (Test-Path -LiteralPath $recordedPdbPath -PathType Leaf) {
              $pdbFile = Get-Item -LiteralPath $recordedPdbPath
            } else {
              $candidates = @(Get-ChildItem -Recurse -Path build -Filter $pdbName -File)
              if ($candidates.Count -ne 1) {
                Write-Error ("PDB '" + $pdbName + "' (recorded in " + $img.bin.FullName + "'s debug info at link " +
                             "time) not found uniquely under build/ -- found " + $candidates.Count +
                             " -- debug artifact would be wrong/incomplete")
              }
              $pdbFile = $candidates[0]
            }
            Copy-Item -Force $pdbFile.FullName (Join-Path $dbg ("Anamorph." + $img.tag + ".pdb"))
          }
          # Written LAST, for the same reason as the Linux strip step: $dbg is
          # created at the top of this step, so gating the debug upload on "this
          # step was not skipped" would fire it against an empty directory when the
          # step aborts before the PDB copies -- a second, misleading failure on
          # if-no-files-found on top of the real one.
          # -Encoding utf8 is explicit: the runner uses pwsh 7 (UTF-8 by default),
          # but Windows PowerShell 5.1 would write UTF-16LE and the runner would
          # not parse the output at all.
          "debug_artifacts=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # v0.9.0 packaging (additive): a user-installable Inno Setup installer
      # built from the SAME validated (debug-purged) staging directory the zip
      # was archived from. It therefore gates on the same `public_ok` checkpoint
      # the customer zip does: repacking a tree that failed validation would
      # launder a rejected build into an installer. ISCC is preinstalled on
      # windows-latest. The deterministic output name embeds the version parsed
      # from CMakeLists.txt.
      - name: Package Windows installer (Inno Setup)
        id: package_windows
        if: ${{ !cancelled() && steps.stage_windows.outputs.public_ok == 'true' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $m = Select-String -Path CMakeLists.txt -Pattern '^project\(Anamorph VERSION ([0-9]+\.[0-9]+\.[0-9]+) '
          if (-not $m) { Write-Error 'could not parse project VERSION from CMakeLists.txt' }
          $version = $m.Matches[0].Groups[1].Value
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup 6 not found at $iscc (expected preinstalled on windows-latest)" }
          $staging = (Resolve-Path 'dist/Anamorph-Windows').Path
          & $iscc "/DAppVersion=$version" "/DStagingDir=$staging" "/Odist" 'packaging/windows/Anamorph.iss'
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with exit code $LASTEXITCODE" }
          $out = "dist/Anamorph-$version-Windows-Installer.exe"
          if (-not (Test-Path $out)) { Write-Error "expected installer output missing: $out" }

      # A failed DSP self-test blocks the CUSTOMER upload (fail-closed), while
      # a pluginval-only failure still yields beta artifacts as before.
      - name: Upload Windows artifacts
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.stage_windows.outputs.public_ok == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-Windows
          path: dist/Anamorph-Windows
          if-no-files-found: error

      # Same fail-closed gate as the customer artifact (tests + its own step).
      - name: Upload Windows installer
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.package_windows.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-Windows-installer
          path: dist/Anamorph-*-Windows-Installer.exe
          if-no-files-found: error

      # Developer debug artifacts are preserved even when validation fails
      # (they never contain customer-facing binaries), but not if the PDB
      # retention never completed -- see the checkpoint note in the staging step.
      - name: Upload Windows debug symbols (crash symbolication)
        if: ${{ !cancelled() && steps.stage_windows.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-Windows-debug
          path: dist/Anamorph-Windows-debug
          if-no-files-found: error

      # WHICH TOOLCHAIN BUILT THE SHIPPED WINDOWS BINARY, recorded rather than
      # assumed. `windows-latest` floats, MSVC is auto-detected, and nothing in
      # this job said which toolset it resolved to -- so a released .vst3 could
      # not be traced back to the compiler that produced it, and an image move
      # changed the shipped toolchain with no line in any diff. This is the same
      # class the `linux` job's ABI floor covers, and it is recorded here for the
      # same reason: the number falls out of the image, so the run that changes
      # it should be the run that says so.
      #
      # WHAT IS ASSERTED is deliberately narrow: the MSVC ABI SERIES (`14.x`),
      # not the exact toolset. Every 14.x toolset since VS2015 is binary
      # compatible and needs the same redistributable, so gating on the full
      # version would fail on ordinary compiler updates that change nothing a
      # user can observe -- the "gate that cries wolf" this pipeline is written
      # against. A move OFF 14.x is the event that changes what users must have
      # installed, and that is what fails here.
      #
      # LAST STEP IN THE JOB, and it used to sit between Configure and Build.
      # There, a toolset mismatch skipped the entire Windows build, the two
      # suites, both pluginval gates, the installer and every upload -- so the
      # one event this step exists to detect, an image moving the compiler under
      # us, would have destroyed the evidence needed to judge it. The assertion
      # is unchanged and just as mandatory: `release.yml` depends on this
      # workflow's AGGREGATE result, which a failed job decides wherever in the
      # job it failed, so a mismatch is still release-blocking and can never
      # become a silently successful build. Nothing downstream reads this step's
      # outcome, so moving it weakens no other gate.
      #
      # Gated on CONFIGURE, because that is whose output it reads
      # (`build/CMakeCache.txt`) -- and on configure alone rather than on the
      # build, so the toolset is still recorded when a build fails, which is
      # exactly when knowing the compiler is most useful.
      #
      # The version comes from CMakeCache's compiler/linker path
      # (`...\VC\Tools\MSVC\<version>\bin\...`), which the VS generator
      # always writes -- no developer command prompt, no `vswhere`, no `dumpbin`.
      - name: Record + assert the MSVC toolset
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = 'build/CMakeCache.txt'

          # Two cache keys are tried because which of them carries a full path
          # is a property of the GENERATOR, not of this project, and the VS
          # generator is the one CMake documents least precisely here. Whichever
          # yields a `...\VC\Tools\MSVC\<version>\...` component wins.
          $version = $null
          foreach ($key in 'CMAKE_CXX_COMPILER:FILEPATH', 'CMAKE_LINKER:FILEPATH') {
            $hit = (Select-String -Path $cache -Pattern ('^' + [regex]::Escape($key)) | Select-Object -First 1)
            if ($null -ne $hit -and $hit.Line -match 'MSVC[\\/]+([0-9]+(\.[0-9]+)+)') {
              $version = $Matches[1]
              break
            }
          }

          if ($null -eq $version) {
            # AN ERROR SINCE ADR-0032, where it was a warning before. While the
            # toolset was only a record, an unreadable version was a footnote;
            # now the shipped numerics CONTRACT depends on which side of 14.30
            # the toolset sits (the VS2022 boundary where /fp:precise stopped
            # emitting contractions by default), and an unplaceable toolset
            # cannot anchor that claim. Fail saying what to read, never accept
            # silently.
            Write-Host "::error::INFRASTRUCTURE: could not read an MSVC toolset version from $cache (looked at CMAKE_CXX_COMPILER and CMAKE_LINKER). ADR-0032's /arch:AVX2 Class-A claim requires placing the toolset against the 14.30 contraction-default boundary; an unrecorded toolchain cannot be asserted. Not a numerical failure."
            Select-String -Path $cache -Pattern 'CMAKE_(CXX_COMPILER|LINKER):FILEPATH='
            exit 1
          }

          $series = $version.Split('.')[0]
          Write-Host "MSVC toolset $version (ABI series $series.x)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "MSVC toolset ``$version`` (ABI series ``$series.x``)"

          if ($series -ne '14') {
            Write-Host "::error::MSVC ABI series moved from 14.x to $series.x, which changes the Visual C++ redistributable users need. Confirm the new requirement, update COMPATIBILITY_MATRIX, and raise this assertion in the same change."
            exit 1
          }

          # ADR-0032: the /arch:AVX2 Class-A property rests on the VS2022+
          # /fp:precise non-contracting default, which begins at toolset 14.30.
          # A pre-14.30 toolset could contract by default, silently changing
          # the numerics contract of the shipped Windows binary -- so it FAILS
          # here rather than being inferred from whatever windows-latest
          # currently resolves to (14.51 was observed, never guaranteed).
          $minor = [int]($version.Split('.')[1])
          if ($minor -lt 30) {
            Write-Host "::error::MSVC toolset $version predates 14.30 (VS2022), where /fp:precise stopped emitting floating-point contractions by default -- the property ADR-0032's /arch:AVX2 Class-A claim rests on. A pre-14.30 image silently changes the numerics contract; do not build the shipped Windows binary on it."
            exit 1
          }

  macos:
    # `macos-latest` (Apple Silicon) -- moved off the DEPRECATED `macos-14`
    # image per actions/runner-images. Deliberately the FLOATING label, matching
    # `ubuntu-latest`/`windows-latest` on the other two jobs: a pinned image that
    # reaches end-of-life fails the whole matrix on removal day, whereas the
    # floating label moves with GitHub's rollout and the universal-slice, test,
    # pluginval and packaging gates below detect any toolchain regression it
    # brings. The x86_64 slice is CROSS-compiled here (the runner is arm64) and
    # `lipo -archs` in the packaging step verifies both slices are present.
    runs-on: macos-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The largest of the lineages, and for one reason: these objects are FAT.
      # Every compile emits both an arm64 and an x86_64 slice, and this is the
      # only job building all three plugin formats plus both test suites.
      CCACHE_MAXSIZE: 1G
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build tools
        run: |
          # ninja is PREINSTALLED on this image, so `|| true` keeps a brew
          # hiccup from failing a job that already has its generator.
          brew install ninja || true
          ninja --version
          # ccache is an OPTIMIZATION, never a requirement -- see the
          # compiler-cache block above the jobs.
          if brew install ccache && ccache --version; then
            echo "ANAMORPH_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache unavailable -- building without the compiler cache"
            echo "ANAMORPH_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          fi

      # THE CRITICAL PATH. At 29m44s measured this job is the longest in the
      # workflow and therefore the run's wall-clock, and its build step was
      # 16m40s of that -- more than the four pluginval passes put together.
      #
      # ccache caches multi-arch compilations correctly: the full -arch LIST is
      # part of the hash, so a universal object cannot be served to a thin build
      # or the reverse. Verified before enabling this, and the job's existing
      # `lipo` assertion on both slices is the backstop that would catch it
      # regardless.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-universal-${{ github.run_id }}
          restore-keys: ccache-macos-universal-

      - name: Configure (universal arm64 + x86_64)
        run: >
          ccache --zero-stats || true &&
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + AU + Standalone + tests)
        id: build
        run: cmake --build build --config Release

      # LTO IS STILL LTO, ASSERTED RATHER THAN ASSUMED. `-object_path_lto`
      # (CMakeLists.txt, AnamorphHardening) tells ld64 to keep the object it
      # produces from the merged bitcode instead of deleting it -- which is the
      # object `dsymutil` has to read. That means the directory below is a
      # DIRECT witness to link-time optimisation having happened: ld64 writes
      # into it only when it ran LTO codegen. An empty directory means either
      # the flag stopped taking effect or LTO stopped happening, and both are
      # failures -- the second doubly so, because turning LTO off is the
      # workaround this fix exists to avoid.
      #
      # It runs BEFORE dsymutil so a broken link configuration is reported as
      # itself rather than as "no usable dSYM" three steps later.
      - name: Assert LTO ran and its objects were retained
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DIR="build/lto-objects"
          if [ ! -d "$DIR" ]; then
            echo "::error::$DIR does not exist -- -object_path_lto was not applied to the link"
            exit 1
          fi
          COUNT="$(find "$DIR" -type f | wc -l | tr -d ' ')"
          echo "retained LTO objects: $COUNT"
          find "$DIR" -type f -exec ls -l {} +
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::no LTO object was retained. Either juce_recommended_lto_flags stopped applying -flto to the shipped targets, or the linker stopped honouring -object_path_lto. macOS crash symbolication depends on this; do NOT resolve it by disabling LTO."
            exit 1
          fi

      # Cached objects are real .o files at the paths the linker recorded, so
      # the packaging step's `dsymutil` walk is unaffected -- it reads the same
      # object files it always read, whoever compiled them.
      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      - name: DSP + state self-tests
        id: tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-tests.sh

      # ...AND THE OTHER SLICE. The runner is Apple Silicon and the product is a
      # UNIVERSAL binary, so the step above executes arm64 only: until this step
      # existed the x86_64 slice was compiled on every push and run by nothing, on
      # any platform. Half the macOS user base was validated by compilation alone
      # -- and the deployment target (10.13) exists precisely to claim Intel
      # support.
      #
      # Rosetta 2 runs it in place, so this costs one extra execution of two
      # console apps rather than another runner. If Rosetta is absent the step
      # does NOT quietly pass: it emits a ::warning:: naming the coverage that was
      # lost, because a gate that silently does nothing is the failure mode this
      # workflow is written against. It is a warning rather than an error only
      # because Rosetta's presence is the IMAGE's property, not the product's, and
      # a green product should not go red for it.
      #
      # The `id:` is load-bearing, not decoration: the two CUSTOMER uploads below
      # require this step to have SUCCEEDED, exactly as they require the arm64 run.
      # Without it the outcome is unreferenceable, and a macOS build whose Intel
      # half failed its behavioural gate would still hand testers a downloadable
      # package -- the precise thing the fail-closed rule at the top of this file
      # forbids. The two ways this step is NOT a failure are both deliberate: an
      # absent Rosetta exits 0 (image property, per above) so the uploads proceed
      # on a compilation-only Intel run with the ::warning:: as the record, and a
      # failed BUILD skips it, where `steps.tests` already blocks the upload.
      # ADR-0031 ADDED A SECOND WAY THIS STEP CAN LOSE ITS COVERAGE, and it is
      # the same class as the first: a property of the IMAGE, not of the product.
      # The x86_64 slice is now compiled `-march=haswell`, and Rosetta 2 does not
      # translate AVX2 unless the process asks for it (`ROSETTA_ADVERTISE_AVX`,
      # macOS 15+); where it will not, the slice raises SIGILL under translation
      # while being perfectly correct on real Intel hardware. So the capability is
      # PROBED with a three-line AVX2 program built by the same compiler, before
      # the suites run -- a probe that answers about this image rather than about
      # a version number, exactly as `check_linker_flag` does for lld in
      # CMakeLists. A probe that faults degrades to a ::warning::, like an absent
      # Rosetta, because the blocking Intel gate is the `macos-intel` job on real
      # `macos-15-intel` hardware; this step is the bonus half.
      - name: DSP + state self-tests, x86_64 slice under Rosetta
        id: tests_x86_64
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          ROSETTA_ADVERTISE_AVX: 1
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::Rosetta 2 unavailable on this image -- the x86_64 slice was BUILT but NOT EXECUTED; Intel coverage for this run is compilation only"
            exit 0
          fi
          printf '#include <immintrin.h>\nint main(void){__m256i a=_mm256_set1_epi32(1);a=_mm256_add_epi32(a,a);return _mm256_extract_epi32(a,0)-2;}\n' > "$RUNNER_TEMP/avx2probe.c"
          if ! cc -arch x86_64 -march=haswell -O0 "$RUNNER_TEMP/avx2probe.c" -o "$RUNNER_TEMP/avx2probe" 2>/dev/null; then
            echo "::warning::could not build the AVX2 probe -- skipping the Rosetta run rather than guessing; Intel coverage for this run is compilation only (the blocking Intel gate is the macos-intel job)"
            exit 0
          fi
          if ! arch -x86_64 "$RUNNER_TEMP/avx2probe" 2>/dev/null; then
            echo "::warning::Rosetta 2 on this image does not execute AVX2 (ADR-0031 compiles the x86_64 slice -march=haswell) -- the slice was BUILT but NOT EXECUTED here; the blocking Intel gate is the macos-intel job on native hardware"
            exit 0
          fi
          ANAMORPH_TEST_RUNNER="arch -x86_64" ./scripts/run-tests.sh

      # RH-PR-2 (ADR-0021): order matters -- 1) dsymutil captures a universal
      # dSYM per bundle (the only crash-symbolication source once stripped),
      # 2) strip -x removes local symbols, 3) codesign LAST (stripping after
      # signing would invalidate the seal). Signing and slice verification are
      # no longer '|| true': a failure must fail the job, not silently ship a
      # broken artifact (RH-R9). Proper Developer ID signing + notarization is
      # RH-PR-3 scope.
      #
      # RH-PR-2 follow-up 2 (CI reliability): dsymutil warnings are NOT fatal,
      # and a dSYM is judged on its OUTPUT rather than on warning text -- a
      # produced dSYM is kept only if its DWARF payload exists, its UUID set
      # matches the binary's slices exactly, and it carries at least one DWARF
      # compile unit. That rule is unchanged and still right.
      #
      # WHAT CHANGED (2026-08-18): the outcome it used to produce. Under
      # Release + LTO the DWARF the linked binary references lived in ld64's
      # TEMPORARY LTO object, deleted before dsymutil ran, so dsymutil warned
      # "unable to open object file", exited 0, and emitted a dSYM with no
      # usable DWARF -- correctly discarded here, on EVERY macOS run. macOS
      # symbolication was therefore not merely best-effort, it was never
      # delivered, on the platform whose users most often hand a developer an OS
      # crash log. `-Wl,-object_path_lto` (CMakeLists.txt, AnamorphHardening)
      # keeps that object, and the assertion after the build proves LTO still
      # ran. Measured on the run that landed it: three validated, UUID-matched
      # dSYMs and a 53 MB `Anamorph-macOS-debug` artifact where there had
      # previously been none.
      #
      # SO ZERO USABLE dSYMs IS AN ERROR, not a warning. It was a warning while
      # the zero was an expected property of the build; now that the build
      # produces them, a zero means something broke -- and a silent regression to
      # "no symbolication" is exactly the state this fix ended. Per-bundle
      # discards remain warnings: one degenerate dSYM among three is a partial
      # result worth reporting, not a reason to fail a release.
      #
      # THE ERROR IS RAISED AT THE END OF THE JOB, NOT HERE, and the distinction
      # is the whole point. This step only RECORDS the count (`debug_artifacts`);
      # the assertion is its own final step, after the customer pipeline and
      # every upload have run. Raising it here aborted the step between the
      # `strip -x` loop and the codesign/copy/`lipo`/`nm` half below it, so a
      # debug-capture problem left `dist/Anamorph-macOS` unpopulated and skipped
      # the plug-in upload, the installer and -- through `release.yml`'s
      # aggregate `needs` -- the draft release. macOS users would have got no
      # build at all rather than a build without symbols, which contradicts the
      # rule this comment states: the customer pipeline (strip -x -> codesign ->
      # verify) is never blocked by debug-capture problems. Deferring the
      # assertion keeps BOTH properties: the artifacts are produced and uploaded,
      # and the job still ends red so the release is blocked.
      - name: Package macOS plugins (VST3 + AU + Standalone)
        id: package
        # Same gate, same reason as the Windows staging step above: after a compile error
        # `!cancelled()` is still true, so this would run with nothing to package and report a
        # cascade instead of the cause.
        # It stays `!cancelled()` rather than plain success() so a failing SELF-TEST still
        # produces a beta artifact, exactly as on the other two platforms. It no longer needs to
        # survive a pluginval failure -- the gates now run AFTER this step, against what it
        # produces (see the block below) -- but the self-test clause is the same relaxation and
        # is still load-bearing.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -e
          DIST="dist/Anamorph-macOS"
          DBG="dist/Anamorph-macOS-debug"
          mkdir -p "$DIST" "$DBG"
          VST3="build/Anamorph_artefacts/Release/VST3/Anamorph.vst3"
          AU="build/Anamorph_artefacts/Release/AU/Anamorph.component"
          APP="build/Anamorph_artefacts/Release/Standalone/Anamorph.app"
          USABLE_DSYMS=0
          for B in "$VST3" "$AU" "$APP"; do
            BIN="$B/Contents/MacOS/Anamorph"
            NAME="$(basename "$B")"
            DSYM="$DBG/$NAME.dSYM"
            # ---- Best-effort developer dSYM capture: nothing in this block
            # may abort the job -- failures degrade to a ::warning:: and the
            # dSYM is discarded. Customer-artifact steps are NOT gated on it.
            DSYM_OK=1
            BIN_UUIDS="$(dwarfdump --uuid "$BIN" | awk '{print $2}' | sort)" || BIN_UUIDS=""
            if [ -z "$BIN_UUIDS" ]; then
              echo "::warning::$NAME: cannot read Mach-O slice UUIDs -- a dSYM would be unvalidatable, skipping debug capture"
              DSYM_OK=0
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DSYMUTIL_LOG="$(mktemp)"
              if ! dsymutil "$BIN" -o "$DSYM" >"$DSYMUTIL_LOG" 2>&1; then
                cat "$DSYMUTIL_LOG"
                echo "::warning::$NAME: dsymutil failed -- continuing without a dSYM (best-effort debug capture)"
                DSYM_OK=0
              elif [ -s "$DSYMUTIL_LOG" ]; then
                # Informational only (e.g. the expected Release+LTO
                # "/tmp/lto.o unable to open object file" warnings):
                # usability is decided by validating the OUTPUT below,
                # never by the presence of dsymutil warnings.
                cat "$DSYMUTIL_LOG"
              fi
              rm -f "$DSYMUTIL_LOG"
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              DWARF_FILE="$DSYM/Contents/Resources/DWARF/$(basename "$BIN")"
              if [ ! -s "$DWARF_FILE" ]; then
                echo "::warning::$NAME: dSYM has no (or an empty) DWARF payload -- discarding it. This was the EXPECTED outcome before -Wl,-object_path_lto; it is now a partial regression worth investigating"
                DSYM_OK=0
              else
                DSYM_UUIDS="$(dwarfdump --uuid "$DWARF_FILE" | awk '{print $2}' | sort)" || DSYM_UUIDS=""
                CU_COUNT="$(dwarfdump --debug-info "$DWARF_FILE" 2>/dev/null | grep -c 'DW_TAG_compile_unit' || true)"
                if [ "$DSYM_UUIDS" != "$BIN_UUIDS" ]; then
                  echo "::warning::$NAME: dSYM UUIDs do not match the binary's slices -- discarding the mismatched dSYM"
                  DSYM_OK=0
                elif [ "$CU_COUNT" -eq 0 ]; then
                  echo "::warning::$NAME: dSYM carries no DWARF compile units (degenerate) -- discarding it"
                  DSYM_OK=0
                fi
              fi
            fi
            if [ "$DSYM_OK" -eq 1 ]; then
              USABLE_DSYMS=$((USABLE_DSYMS + 1))
              echo "$NAME: validated dSYM captured (UUID-matched, $CU_COUNT compile units)"
            else
              rm -rf "$DSYM"
            fi
            # ---- Customer artifact: stripping ALWAYS proceeds -- debug
            # capture problems never weaken or skip it.
            strip -x "$BIN"
          done
          if [ "$USABLE_DSYMS" -eq 0 ]; then
            echo "::warning::no usable dSYM was produced -- the customer pipeline below continues, and the 'Assert a validated dSYM was captured' step at the end of this job will fail the run."
          fi
          # Written BEFORE codesign/copy/verification below so dSYMs captured
          # above still upload even if those later steps fail. (A strip
          # failure inside the loop above aborts earlier, leaving the flag
          # unwritten -- the -debug upload is then skipped along with the
          # failed job, which is the fail-closed default.)
          #
          # It is also what the end-of-job assertion reads, which is why that
          # assertion can be deferred at all: the count is captured here, at the
          # moment it is known, and judged after the customer artifacts are safe.
          echo "debug_artifacts=$([ "$USABLE_DSYMS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Ad-hoc codesign so macOS will load the bundles after quarantine removal.
          codesign --force --deep --sign - "$VST3"
          codesign --force --deep --sign - "$AU"
          codesign --force --deep --sign - "$APP"
          cp -R "$VST3" "$DIST/"
          cp -R "$AU"   "$DIST/"
          cp -R "$APP"  "$DIST/"
          cp packaging/macos/INSTALL.txt "$DIST/INSTALL.txt"
          # Attribution/support files are NOT staged (packages carry only what
          # a user needs to install; INSTALL.txt is installation-only). They
          # ship as version-named release-page assets, the SOLE carrier of the
          # mandatory IJG acknowledgement -- RELEASE_POLICY forbids publishing
          # a release without them.
          # ASSERT both slices are present -- do not merely print them. This step
          # used to `echo` the output of `lipo -archs`, which verifies NOTHING:
          # `lipo -archs` exits 0 for ANY valid Mach-O, including a thin one, so
          # an arm64-only build would have shipped labelled universal and Intel
          # users would have got a plug-in that cannot load, with a green tick and
          # the evidence sitting unread in the log. Not hypothetical: a folded
          # YAML scalar silently swallowing the trailing configure flags is a
          # documented accident in this class of workflow, and the same accident
          # on -DCMAKE_OSX_ARCHITECTURES produces exactly that thin build.
          for B in "$DIST/Anamorph.vst3/Contents/MacOS/Anamorph" \
                   "$DIST/Anamorph.component/Contents/MacOS/Anamorph" \
                   "$DIST/Anamorph.app/Contents/MacOS/Anamorph"; do
            ARCHES="$(lipo -archs "$B")"
            echo "== $B == $ARCHES"
            for WANT in arm64 x86_64; do
              case " $ARCHES " in
                *" $WANT "*) ;;
                *) echo "::error::$B is missing the $WANT slice (found: $ARCHES) -- not a universal binary"; exit 1 ;;
              esac
            done
          done
          # The stripped, signed plugin must still expose its VST3 entry point.
          nm -gU "$DIST/Anamorph.vst3/Contents/MacOS/Anamorph" | grep -q GetPluginFactory
          # The customer artifact must contain no debug material (parity with
          # the Linux/Windows staging self-checks).
          if find "$DIST" \( -name '*.dSYM' -o -name '*.debug' -o -name '*.pdb' \) -print | grep -q .; then
            echo "::error::customer artifact contains debug files"; exit 1
          fi
          # The Anamorph-macOS artifact uploads the staged FILES, so its
          # downloaded zip contains the bundles directly (extract once, no
          # wrapper folder, no nested archive) -- at the cost of the
          # executable bits, which the artifact transport drops; INSTALL.txt
          # documents the chmod fallback for the Standalone app on that
          # route. release.yml restores those bits on Contents/MacOS/* and
          # archives the tree into the published release zip. The ad-hoc
          # signature written above lives inside each Mach-O and in
          # Contents/_CodeSignature -- ordinary files -- so it survives the
          # artifact round-trip; only the mode bits need restoring.

      # =====================================================================
      # THE RELEASE GATE RUNS HERE, AFTER PACKAGING, AND THAT ORDERING IS THE
      # POINT: it is what makes macOS validate the bytes it actually ships.
      #
      # It used to run before the packaging step, which meant every macOS
      # pluginval pass described a bundle that no longer existed by the time the
      # artifact was uploaded -- `strip -x` and `codesign --force --deep` both
      # rewrite the Mach-O afterwards, so a defect introduced BY stripping or
      # signing shipped unvalidated. Linux has always validated post-strip for
      # exactly this reason; this is macOS catching up, and it closes the
      # asymmetry rather than documenting it.
      #
      # It is free to do, because the packaging step mutates the bundles IN
      # PLACE in the build tree and only then copies them to `dist/` -- so the
      # shipped tree exists at this point and both formats can be named
      # explicitly with ANAMORPH_PLUGINVAL_BUNDLE. Naming them beats letting
      # `run-pluginval.sh` search `build/`: the build tree now holds the same
      # bytes, but "the copy we ship" is the claim being made, so it is the copy
      # that gets pointed at.
      #
      # THE COST, stated rather than discovered: these steps gate on `package`,
      # so a packaging failure now skips validation. That is the same trade
      # Linux already makes (`steps.strip.outcome == 'success'`) and for the same
      # reason -- a half-packaged bundle is in a state nobody ships, and
      # validating it adds a red step that hides the real cause. The uploads are
      # unaffected: they gate on `tests` + `package`, never on pluginval, so a
      # validation-only failure still yields a beta artifact exactly as before.
      # =====================================================================

      # INSTALL THE AU BEFORE VALIDATING IT, deliberately, and not as
      # belt-and-braces. macOS resolves Audio Units through the AudioComponent
      # registry (`AudioComponentFindNext`, which is what JUCE's
      # AudioUnitPluginFormat calls), and the registry only knows about bundles
      # under a Components directory. A .component sitting outside one can
      # therefore report ZERO plugin types however correct it is -- which would
      # make this gate red for an environmental reason, or (worse, if pluginval
      # ever treats "no types" as nothing to do) green without validating
      # anything. Installing first removes the question instead of depending on
      # the answer.
      #
      # The source is now `dist/` -- the stripped, ad-hoc-signed, slice-verified
      # tree the artifact is uploaded from. An ad-hoc signature is what lets
      # macOS load the bundle at all after quarantine removal, so this is also
      # the first point at which the installed copy is in the state a user's
      # machine sees.
      #
      # `killall AudioComponentRegistrar` forces the registry to re-scan rather
      # than serve a cached list; it is `|| true` because the daemon may simply
      # not be running yet on a fresh runner, which is not a failure. The copy
      # itself is NOT `|| true`.
      - name: Install the packaged AU so the AudioComponent registry can find it
        id: au_install
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -e
          DEST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DEST"
          rm -rf "$DEST/Anamorph.component"
          cp -R dist/Anamorph-macOS/Anamorph.component "$DEST/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "bundle=$DEST/Anamorph.component" >> "$GITHUB_OUTPUT"
          ls -d "$DEST/Anamorph.component"

      - name: pluginval VST3 (deterministic x3 -- release gate)
        # Gated on `package`, which is what produces the bytes being validated --
        # the same "name the producer, never a bare !cancelled()" rule the other
        # two platforms follow. `!cancelled()` is still there so a FAILING
        # deterministic run cannot skip the randomise run below.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: dist/Anamorph-macOS/Anamorph.vst3
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} deterministic vst3

      - name: pluginval VST3 (randomise x3 -- release gate)
        # NEVER skipped for a deterministic FAILURE: both modes must report independently, so a
        # deterministic failure cannot hide the randomise result. It IS skipped when packaging did
        # not produce a shippable bundle, because `!cancelled()` alone is true after ANY upstream
        # failure -- which produced a "not found -- build first" line that read like the cause and
        # buried the real one. The job still fails if either gate fails.
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: dist/Anamorph-macOS/Anamorph.vst3
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} randomise vst3

      # THE AU IS VALIDATED TOO, and only here -- it is the one format that
      # exists on exactly one platform, and the ONLY one Logic and GarageBand
      # load. Before this the release gate ran against the VST3 alone on all
      # three OSes, so the AU shipped to Logic users having passed no automated
      # validation at all, on a build where `lipo -archs` output was printed
      # rather than asserted. Same strictness (the env block above is still the
      # only copy), same two modes, same 3 consecutive passes -- an AU that only
      # passes sometimes is not a passing AU.
      #
      # Gated on the INSTALL, never on the VST3 steps: a VST3 failure must not
      # hide the AU's result, and vice versa. The install itself gates on
      # `package`, so that dependency is carried without repeating it.
      - name: pluginval AU (deterministic x3 -- release gate)
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} deterministic au

      - name: pluginval AU (randomise x3 -- release gate)
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} randomise au

      # Leave the runner as we found it. On an ephemeral runner this is
      # cosmetic, but `docs/procedures/TESTING.md` now tells a human to
      # reproduce these steps locally, and an install into a real
      # ~/Library/Audio/Plug-Ins/Components that nothing removes is a surprise
      # worth not shipping in the instructions. `!cancelled()` and the
      # not-skipped test rather than `success()`: the copy exists whenever the
      # install step ran at all, including when a later gate failed, and that is
      # exactly when it most needs removing.
      - name: Remove the AU installed for validation
        if: ${{ !cancelled() && steps.au_install.outcome != 'skipped' }}
        run: rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Anamorph.component"

      # v0.9.0 packaging (additive): a user-installable .pkg (RH-PR-6
      # skeleton) built from the SAME validated staging dir the zip was
      # archived from. pkgbuild/productbuild are OS-native on the runner;
      # RH-PR-3 will later sign+notarize this same package. The deterministic
      # output name embeds the version parsed from CMakeLists.txt.
      - name: Package macOS installer (.pkg)
        id: package_macos_pkg
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          set -e
          VERSION="$(sed -nE 's/^project\(Anamorph VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt)"
          test -n "$VERSION"
          chmod +x packaging/macos/build-pkg.sh
          packaging/macos/build-pkg.sh dist/Anamorph-macOS "$VERSION" "dist/Anamorph-${VERSION}-macOS.pkg"

      # Customer-artifact safety (RH-PR-2 review): upload only a fully
      # packaged (dSYM-captured, stripped, signed, slice- and entry-point-
      # verified) artifact — same gating pattern as Linux/Windows. The
      # packaging step itself is leak-safe by ordering (strip precedes every
      # copy into the public staging dir, under set -e).
      # A failed DSP self-test blocks the CUSTOMER upload (fail-closed), while
      # a pluginval-only failure still yields beta artifacts as before.
      # BOTH slices count. The product ships as a universal binary, so `steps.tests`
      # (arm64, native) is only half of its behavioural gate; `steps.tests_x86_64`
      # (Rosetta) is the other half, and an Intel failure is a product failure, not
      # an environment one. Gating on the arm64 run alone would ship a package to
      # every Intel user off a run that proved the Intel slice misbehaves.
      - name: Upload macOS plugins (VST3 + AU + Standalone)
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.tests_x86_64.outcome == 'success' && steps.package.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-macOS
          path: dist/Anamorph-macOS
          if-no-files-found: error

      # Same fail-closed gate as the customer artifact (both slices' tests + its
      # own step) -- the .pkg installs the same universal bundles.
      - name: Upload macOS installer
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.tests_x86_64.outcome == 'success' && steps.package_macos_pkg.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-macOS-installer
          path: dist/Anamorph-*-macOS.pkg
          if-no-files-found: error

      # Uploaded only when at least one VALIDATED dSYM was captured: with zero
      # usable dSYMs the upload is skipped -- with a warning already emitted by
      # the package step -- instead of failing on an empty directory with
      # `if-no-files-found: error`, which would report the wrong cause. The
      # missing dSYM is not tolerated by this skip; the step after this one
      # fails the job for it. The outputs flag is written before the abortable
      # packaging steps, so dSYMs captured before a later codesign/verification
      # failure are still preserved.
      - name: Upload macOS debug symbols (dSYMs, crash symbolication)
        if: ${{ !cancelled() && steps.package.outcome != 'skipped' && steps.package.outputs.debug_artifacts == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-macOS-debug
          path: dist/Anamorph-macOS-debug
          if-no-files-found: error

      # LAST STEP IN THE JOB, DELIBERATELY. macOS crash symbolication is a
      # release contract (`RELEASE_HARDENING_PLAN.md`, RH-R8) and losing it must
      # fail the run -- but it must not COST the run its artifacts on the way
      # out. Everything that produces or validates a customer-facing byte has
      # already happened by the time this runs: packaging, ad-hoc signing, the
      # universal-slice and entry-point assertions, both pluginval gates, the
      # `.pkg`, and all three uploads. So a symbol-capture regression yields
      # exactly what the reader of a red run needs -- the plug-in, the installer
      # and the failure -- instead of nothing.
      #
      # Failing here still blocks the release: `release.yml` depends on this
      # workflow's AGGREGATE result (`needs: [validate, build]`), which a failed
      # job decides regardless of where in the job it failed. Release eligibility
      # is therefore unchanged by moving the assertion; only the artifacts'
      # survival is.
      #
      # Gated on the packaging step having SUCCEEDED, because
      # `debug_artifacts` is its output: if packaging failed or was skipped, that
      # failure is the story and a second one here would only bury it.
      - name: Assert a validated dSYM was captured
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: |
          if [ "${{ steps.package.outputs.debug_artifacts }}" != "true" ]; then
            echo "::error::no usable dSYM was produced. Since -Wl,-object_path_lto landed this is a REGRESSION, not the expected Release+LTO outcome: ld64 keeps the LTO object dsymutil needs, and the 'Assert LTO ran' step earlier in this job confirmed it did. Check that flag and the retained-object directory. Do NOT resolve this by disabling LTO, and do NOT relax this assertion -- the customer artifacts for this run were built, validated and uploaded before this step ran."
            exit 1
          fi
          echo "validated dSYM(s) captured and uploaded as Anamorph-macOS-debug"

  # ==========================================================================
  #  NATIVE INTEL macOS -- the one execution environment nothing else covers.
  #
  #  ADOPTED FROM THE SIBLING PRODUCT ANABASIS (its `macos-intel` job), which is
  #  the only capability in that repository's CI this one did not already have.
  #  It is NOT "the macOS job again on another runner". The distinction it exists
  #  for is exactly this one:
  #
  #      an x86_64 binary running under Rosetta   (the `macos` job above)
  #      an x86_64 binary running on Intel silicon (this job)
  #
  #  The `macos` job builds a UNIVERSAL binary on an Apple Silicon runner, so its
  #  x86_64 half is CROSS-compiled there and then executed only under Rosetta 2 --
  #  which translates the x86_64 instruction stream and runs the result on arm64
  #  hardware. Whether that translation preserves every floating-point corner is
  #  Apple's contract, not this product's, and it is not the machine a user with
  #  an Intel Mac has. Four defect classes live in the gap, and no other job in
  #  this workflow can see any of them:
  #
  #    1. INTEL CODE GENERATION. The shipped x86_64 slice is emitted by the
  #       back end at -O3 + LTO and, until this job, was executed by nothing that
  #       was actually an Intel CPU. A miscompile there reaches every Intel user
  #       and no gate.
  #    2. THE DENORMAL INVARIANT. `tests/dsp_tests.cpp` asserts no denormals in
  #       the engine output, and that holds because `juce::ScopedNoDenormals`
  #       flushes them IN HARDWARE -- MXCSR's FTZ/DAZ bits on x86_64, FPCR's FZ
  #       on arm64. On this runner the assertion is finally checked against the
  #       register the shipped Intel slice will really set. (The same invariant
  #       is why the valgrind step needs `ANAMORPH_TESTS_NO_FTZ=1`: an emulator
  #       that does not honour those bits cannot answer this question either.)
  #    3. THE INTEL AUDIOUNIT / VST3 RUNTIME. pluginval hosts the bundles
  #       through the OS's own component registry and plug-in loader. On this
  #       runner that is the Intel macOS 15 implementation, not the arm64
  #       macOS 26 one.
  #    4. A SECOND APPLECLANG ON THE macOS SIDE. `macos-latest` and this image
  #       do not carry the same Xcode. The four `-Wimplicit-int-float-conversion`
  #       sites that sat in the tree for months and surfaced only when the macOS
  #       image moved (CI_CD.md §Build matrix) are the worked example of what a
  #       single macOS toolchain costs.
  #
  #  DELIBERATELY NOT A SHIPPING JOB. It packages nothing, signs nothing, uploads
  #  nothing: the artifact users receive is still the universal bundle built and
  #  gated by `macos` above, and duplicating that here would add a second macOS
  #  artifact with no way to say which is authoritative. The honest scope of this
  #  job is "the source, compiled for x86_64, behaves correctly when an Intel CPU
  #  executes it" -- which is the half the Rosetta step cannot answer. The Rosetta
  #  step answers the other half ("the SHIPPED slice executes correctly"), so the
  #  two are complements and neither replaces the other. Both remain.
  #
  #  COST, measured rather than guessed: the sibling's equivalent job takes ~26
  #  minutes wall-clock end to end, of which ~19 is the build. `macos` here is
  #  ~24, so this becomes the critical path by a few minutes and adds no billable
  #  minutes (public repository). `ANAMORPH_BUILD_STANDALONE=OFF` keeps that
  #  number down for free -- the Standalone target recompiles the identical
  #  translation units and nothing in this job validates it, which is the same
  #  reason `codeql.yml` and `msvc.yml` already turn it off.
  # ==========================================================================
  # A7-5E LIVES IN ITS OWN JOB, and the reason is a lesson rather than a
  # preference. It first ran inside the packaging `macos` job, produced correct
  # numbers, and they were UNREADABLE: that job emits a dSYM warning flood of
  # several hundred thousand lines afterwards, and every log-retrieval path caps
  # out long before reaching back past it. A measurement nobody can read is not
  # a measurement. Here the log is a few hundred lines and the answer is the
  # last thing in it.
  #
  # It also belongs here on the merits: this is an experiment, not a release
  # step, and it has no business inside the job that signs and uploads customer
  # artifacts. Nothing depends on it and it gates nothing.
  #
  # continue-on-error AT THE JOB LEVEL, and the placement is the point. The
  # comparison STEP already exits 0 on every path, but the job could still fail
  # -- and, because release.yml consumes this workflow's aggregate result via
  # workflow_call, BLOCK A RELEASE -- through the parts no step guards: a
  # checkout or JUCE-fetch failure, a runner loss, or the timeout-minutes
  # cutoff. A reporting-only experiment must never decide whether customers get
  # a release, so the JOB is marked non-failing: an infrastructure failure
  # still shows red on this job with its log intact (nothing is converted to
  # success -- the failure stays visible and truthful), it just no longer
  # propagates into the workflow conclusion. Contrast windows-avx2-ab, which is
  # a BLOCKING ADR-0032 gate and therefore deliberately does the opposite:
  # there an infrastructure failure fails the workflow, fail-closed, with an
  # "INFRASTRUCTURE:" label distinguishing it from a numerical one.
  macos-crossslice:
    runs-on: macos-latest
    timeout-minutes: 30
    continue-on-error: true
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch JUCE (configure only)
        run: cmake -B build-juce -G Ninja -DANAMORPH_BUILD_TESTS=OFF -DANAMORPH_BUILD_STANDALONE=OFF >/dev/null

      # A7-5E: ARE THE TWO SLICES OF THE SHIPPED UNIVERSAL BINARY NUMERICALLY
      # THE SAME? Nothing in this repository has ever asked. The suites assert
      # behaviour and pluginval asserts conformance; neither compares the arm64
      # and x86_64 halves to EACH OTHER, and `TESTING_POLICY` runs them three
      # times for the denormal flush bits rather than for numerics.
      #
      # REPORTING ONLY, AND THAT IS A DELIBERATE CHOICE RATHER THAN TIMIDITY.
      # A gate asserts a property the project has committed to. This one has
      # not: no policy, ADR or doc claims cross-architecture bit identity, and
      # a Linux measurement (GCC 13 + qemu-user, `PERF_AUDIT_A7-2B_A7-5E_
      # IMPLEMENTATION.md` §5) already found the slices differ. Failing every
      # macOS run on an unclaimed property would be inventing a contract by
      # CI rather than deciding one. This step MEASURES so the decision can be
      # made; whoever makes it can promote this to a gate in the same change.
      # It therefore exits 0 on every path, including its own build failures.
      #
      # BOTH FLAG SETS, because the question has two halves. At DEFAULT flags it
      # asks what the shipped binary does -- which since ADR-0031 means the
      # x86_64 slice at `-march=haswell -ffp-contract=off`. That does not move
      # the recorded finding: the frozen baseline had no FMA instruction, so
      # contraction was already impossible on x86-64 and the flag pins what was
      # true by accident. Part 2 therefore still changes only the arm64 side. With `-ffp-contract=off` on both
      # sides it asks how much of any difference is FP contraction -- which
      # arm64 does unconditionally (FMLA is in its base ISA) and the frozen
      # x86-64 baseline cannot do at all. On Linux that split was total and
      # clean: 32/32 differ at default, and with contraction off exactly the 8
      # oversampling-x1 scenarios agree while all 24 at x2/x4/x8 still differ,
      # the residual being libm-derived oversampling coefficients. Whether that
      # pattern holds against APPLE's libm and Apple Clang is precisely what
      # this step exists to find out.
      #
      # `--self-check` on every build, per the harness's own argument: a
      # collapsed scenario set reports 32 confident and meaningless hashes.
      - name: A7-5E — cross-slice numeric comparison (reporting only)
        continue-on-error: true
        env:
          ROSETTA_ADVERTISE_AVX: 1
        run: |
          set +e
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "::warning::A7-5E: Rosetta 2 unavailable -- the x86_64 slice cannot be EXECUTED here, so the cross-slice comparison is skipped"
            exit 0
          fi
          # ADR-0031: the x86_64 slice is now compiled -march=haswell, and Rosetta
          # 2 does not translate AVX2 unless the process asks for it. Probe before
          # building two dumps that could only SIGILL. The finding this job
          # reports is CLOSED and recorded either way (A7_DECISION_PACKET
          # Decision 3); the job is the standing re-check, not the evidence.
          printf '#include <immintrin.h>\nint main(void){__m256i a=_mm256_set1_epi32(1);a=_mm256_add_epi32(a,a);return _mm256_extract_epi32(a,0)-2;}\n' > "$RUNNER_TEMP/avx2probe.c"
          if ! cc -arch x86_64 -march=haswell -O0 "$RUNNER_TEMP/avx2probe.c" -o "$RUNNER_TEMP/avx2probe" 2>/dev/null \
             || ! arch -x86_64 "$RUNNER_TEMP/avx2probe" 2>/dev/null; then
            echo "::warning::A7-5E: Rosetta 2 on this image does not execute AVX2 (ADR-0031 compiles the x86_64 slice -march=haswell) -- the cross-slice comparison is skipped"
            exit 0
          fi
          JUCE="${GITHUB_WORKSPACE}/build-juce/_deps/juce-src"
          build_dump () {   # $1 = arch, $2 = extra flags, $3 = build dir
            cmake -B "$3" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DANAMORPH_BUILD_DSPDUMP=ON -DANAMORPH_BUILD_TESTS=OFF \
              -DANAMORPH_BUILD_STANDALONE=OFF \
              -DCMAKE_OSX_ARCHITECTURES="$1" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
              -DCMAKE_CXX_FLAGS="$2" \
              -DANAMORPH_JUCE_PATH="$JUCE" >/dev/null 2>&1 \
            && cmake --build "$3" --target AnamorphDspDump >/dev/null 2>&1
          }
          run_dump () {     # $1 = build dir, $2 = runner prefix, $3 = output file
            local exe; exe="$(find "$1" -name AnamorphDspDump -type f -perm -111 | head -1)"
            [ -n "$exe" ] || { echo "  (no binary in $1)"; return 1; }
            $2 "$exe" --self-check >/dev/null 2>&1 || { echo "  (--self-check FAILED for $1 -- hashes not trustworthy)"; return 1; }
            $2 "$exe" > "$3" 2>&1
          }
          # RESULTS GO TO THE STEP SUMMARY AND TO ANNOTATIONS, not only to stdout.
          # This job's log carries a very large dSYM warning flood, and a result
          # buried behind it is a result nobody reads -- including the tooling
          # that fetches logs by tail. `$GITHUB_STEP_SUMMARY` renders on the run
          # page; `::notice::` is retrievable through the checks API.
          say () { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          compare () {      # $1 = label, $2 = flags, $3 = tag
            say ""; say "### $1"
            build_dump arm64  "$2" "bd-a-$3" || { say "- arm64 build FAILED"; echo "::notice::A7-5E $3: arm64 build failed"; return 0; }
            build_dump x86_64 "$2" "bd-x-$3" || { say "- x86_64 build FAILED"; echo "::notice::A7-5E $3: x86_64 build failed"; return 0; }
            run_dump "bd-a-$3" ""             "d-a-$3.txt" || { say "- arm64 run FAILED"; return 0; }
            run_dump "bd-x-$3" "arch -x86_64" "d-x-$3.txt" || { say "- x86_64 run FAILED"; return 0; }
            # SCENARIO RECORDS, NOT TEXT LINES (review 2026-08-30). The dump
            # prints its self-check verdict, a blank line and two `#` header
            # lines ahead of the table, and the earlier `grep -c .` counted
            # every nonblank one of those as an agreeing "line" -- a wording
            # change in the self-check output would have moved the reported
            # totals with no DSP change at all. A record is a row whose second
            # field is a 16-hex FNV hash -- the same acceptance rule the
            # windows-avx2-ab gate's Read-Dump uses (its first run counted the
            # self-check line as a 33rd scenario; same defect class). The
            # expected count is DERIVED from what parses -- both slices must
            # yield the same nonzero record count or no verdict is printed --
            # and the exact comparison is preserved on the full record
            # (name, hash, latency). Reporting semantics unchanged: every path
            # still returns 0.
            parse () {  # $1 = dump output, $2 = sorted records out
              awk '$1 !~ /^#/ && NF >= 3 && length($2) == 16 && $2 ~ /^[0-9a-f]+$/ \
                   { print $1, $2, $3 }' "$1" | sort > "$2"
            }
            local agree differ na nx
            parse "d-a-$3.txt" "r-a-$3.txt"
            parse "d-x-$3.txt" "r-x-$3.txt"
            na=$(wc -l < "r-a-$3.txt" | tr -d ' ')
            nx=$(wc -l < "r-x-$3.txt" | tr -d ' ')
            if [ "$na" -eq 0 ] || [ "$na" -ne "$nx" ]; then
              say "- **NO VERDICT** — scenario records failed to parse ($na arm64 vs $nx x86_64)"
              echo "::warning::A7-5E $3: scenario records failed to parse ($na vs $nx) -- no verdict"
              return 0
            fi
            if cmp -s "r-a-$3.txt" "r-x-$3.txt"; then
              say "- **arm64 == x86_64 — IDENTICAL** (all $na scenarios agree)"
              echo "::notice::A7-5E $3: arm64 and x86_64 are IDENTICAL ($na scenarios)"
            else
              agree=$(join -j1 "r-a-$3.txt" "r-x-$3.txt" 2>/dev/null | awk '$2==$4 && $3==$5' | wc -l | tr -d ' ')
              differ=$((na - agree))   # a name present on one side only counts as differing
              say "- **arm64 != x86_64** — $differ of $na scenario(s) differ, $agree agree"
              echo "::notice::A7-5E $3: $differ of $na scenario(s) differ, $agree agree"
              say ""; say "  scenarios that AGREE:"
              join -j1 "r-a-$3.txt" "r-x-$3.txt" 2>/dev/null \
                | awk '$2==$4 && $3==$5 {print "  - " $1}' | head -40 | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          }
          echo "## A7-5E — cross-slice numeric comparison (reporting only)" >> "$GITHUB_STEP_SUMMARY"
          compare "A7-5E part 1: shipped flags"            ""                   def
          compare "A7-5E part 2: -ffp-contract=off on both" "-ffp-contract=off" noc
          echo "=== end A7-5E (reporting only; this step never fails the job) ==="
          exit 0


  macos-intel:
    # PINNED BY NECESSITY, not by preference -- the one runner label in this
    # workflow that cannot float. Per `actions/runner-images`, `macos-latest`
    # (and `macos-26`, `macos-15`) are the ARM64 images and the Intel ones are
    # separately named: `macos-15-intel` and `macos-26-intel`, both GA;
    # `macos-14`/`macos-14-xlarge` are deprecated. "Latest" therefore has no
    # Intel reading to follow -- the Intel image has to be named. This is NOT
    # the `macos` job's float being walked back: that job tracks the
    # ENVIRONMENT the product is tested against, this one names an ISA.
    #
    # 15 RATHER THAN 26, deliberately. `macos-26-intel` would carry the same
    # Xcode generation as `macos-latest`, making this job differ from `macos`
    # in ISA alone; `macos-15-intel` differs in toolchain too, which is the
    # point -- a second AppleClang on the macOS side is coverage this project
    # has already paid for the lack of (the four -Wimplicit-int-float-conversion
    # sites sat in the tree for months and surfaced only when the macOS image
    # moved). THE COST, stated rather than discovered: a failure seen only here
    # has two candidate causes, ISA and toolchain. The disambiguation is a
    # one-word edit -- re-run this job on `macos-26-intel`; if it still fails,
    # the cause is the ISA. It is also the configuration the sibling product
    # runs green today on the same JUCE 9.0.1 pin and the same 10.13
    # deployment target, which is why it is the one adopted rather than guessed.
    #
    # If a future label change ever lands this job on Apple Silicon anyway, the
    # first step below fails it loudly rather than reporting a green tick about
    # the wrong architecture.
    runs-on: macos-15-intel
    # Bounded like every other job here. It matters more on this one than on
    # most: `scripts/run-pluginval.sh` passes --timeout-ms 600000, so twelve
    # pluginval passes have a theoretical ceiling of two hours before GitHub's
    # 6-hour default would ever apply -- and release.yml reuses this workflow
    # whole, so a wedged pass would hold a release for that long. Measured
    # runtime is 21m26s; 60 leaves room for a cold cache and a slow runner
    # while still failing in the same hour.
    timeout-minutes: 60
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CCACHE_COMPILERCHECK: content
    # The SAME same-repo PR guard every other build job carries -- see the block
    # above the `jobs:` key. Without it this job would run twice per same-repo PR
    # commit (once for the push, once for the PR event), which is the duplicate
    # matrix that guard exists to remove. `merge-check` remains the complement
    # and is untouched: it builds the merge result on Linux and is deliberately
    # not a four-platform rerun.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # FAIL, DO NOT WARN, and run it before anything else is spent. A job whose
      # entire purpose is "execute on Intel" is worse than absent if it quietly
      # executes somewhere else: the green tick would be read as "Intel is fine".
      # Both wrong answers are caught -- `uname -m` catches an arm64 runner, and
      # `sysctl.proc_translated` (1 under Rosetta, 0 or absent on real Intel)
      # catches a translated shell on an arm64 runner, which `uname -m` alone
      # would report as x86_64.
      #
      # This is the one place in this workflow where an ENVIRONMENT property is
      # a hard failure rather than a `::warning::`. That is deliberate and it is
      # the opposite call from the Rosetta step in `macos`: there the coverage is
      # a bonus on top of a job that has other work to do, so a missing Rosetta
      # degrades to a warning; here the coverage IS the job.
      - name: Assert this really is native Intel (not Apple Silicon, not Rosetta)
        run: |
          set -e
          ARCH="$(uname -m)"
          TRANSLATED="$(sysctl -n sysctl.proc_translated 2>/dev/null || echo 0)"
          echo "uname -m = $ARCH ; sysctl.proc_translated = $TRANSLATED"
          sysctl -n machdep.cpu.brand_string || true
          sw_vers || true
          if [ "$ARCH" != "x86_64" ]; then
            echo "::error::this job must run on native x86_64 (got $ARCH) -- the coverage it exists for cannot be produced here"
            exit 1
          fi
          if [ "$TRANSLATED" != "0" ]; then
            echo "::error::running under Rosetta translation -- that is precisely the coverage this job exists to go beyond (the macos job already runs the x86_64 slice under Rosetta)"
            exit 1
          fi

      - name: Install build tools
        run: |
          # ninja is PREINSTALLED on this image, so `|| true` keeps a brew
          # hiccup from failing a job that already has its generator.
          brew install ninja || true
          ninja --version
          # ccache is an OPTIMIZATION, never a requirement -- see the
          # compiler-cache block above the jobs.
          if brew install ccache && ccache --version; then
            echo "ANAMORPH_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          else
            echo "::warning::ccache unavailable -- building without the compiler cache"
            echo "ANAMORPH_COMPILER_LAUNCHER=" >> "$GITHUB_ENV"
          fi

      # Its own lineage, and it must be: these objects are thin x86_64 emitted
      # by a different compiler on a different image from `macos`. Sharing that
      # job's lineage would transfer a cache in which nothing here can hit.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-macos-intel-${{ github.run_id }}
          restore-keys: ccache-macos-intel-

      # THIN x86_64, not universal. The universal binary is the shipping
      # configuration and `macos` above already builds, asserts and ships it;
      # what is wanted here is that every object came out of the Intel code
      # generator and that there is no arm64 slice present for the loader to
      # pick instead. Same deployment target as the shipping build (10.13 --
      # the flag that claims Intel support in the first place) and the same
      # build number, so the only intended difference from the shipped x86_64
      # slice is the machine that compiled it.
      - name: Configure (native x86_64 only)
        run: >
          ccache --zero-stats || true &&
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES=x86_64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DANAMORPH_BUILD_STANDALONE=OFF
          -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build (VST3 + AU + tests)
        run: cmake --build build --config Release

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

      # ASSERT the architecture of what was just built -- do not assume it from
      # the configure line. This is the same lesson the packaging step in `macos`
      # learned the expensive way: a folded YAML scalar silently swallowing the
      # trailing configure flags is a documented accident in this class of
      # workflow, and `-DCMAKE_OSX_ARCHITECTURES` is one of the flags it eats.
      # There it produced a thin binary shipped as universal; here it would
      # produce a binary this job then describes as "native Intel" on the
      # strength of the runner alone. `lipo -archs` is asserted, never echoed:
      # it exits 0 for any valid Mach-O.
      #
      # The two test executables are NOT listed: they assert themselves by
      # running below. An arm64 binary on this host cannot exec at all ("Bad CPU
      # type in executable"), which is a louder failure than any check here.
      - name: Assert the built bundles are thin x86_64
        id: thin
        run: |
          set -e
          for B in "build/Anamorph_artefacts/Release/VST3/Anamorph.vst3/Contents/MacOS/Anamorph" \
                   "build/Anamorph_artefacts/Release/AU/Anamorph.component/Contents/MacOS/Anamorph"; do
            ARCHES="$(lipo -archs "$B")"
            echo "== $B == $ARCHES"
            if [ "$ARCHES" != "x86_64" ]; then
              echo "::error::$B is '$ARCHES', expected exactly 'x86_64' -- this job validates the Intel code generator, and a slice it did not emit is not that"
              exit 1
            fi
          done

      # The behavioural gate, on Intel silicon. Same script, same fail-closed
      # discovery, no ANAMORPH_TEST_RUNNER prefix -- the binaries are native
      # here, which is the entire point.
      - name: DSP + state self-tests, native Intel
        run: |
          chmod +x scripts/*.sh
          ./scripts/run-tests.sh

      # Same reason as in `macos`: macOS resolves Audio Units through the
      # AudioComponent registry, which only knows about bundles under a
      # Components directory, so a never-installed `.component` can report zero
      # plugin types however correct it is. Installed from the BUILD TREE rather
      # than a `dist/` staging tree because this job packages nothing -- what is
      # being validated is Intel behaviour, not the shipped bytes (those are the
      # universal bundle, gated post-packaging in `macos`).
      #
      # Gated on `thin` rather than `tests` so a self-test failure does not skip
      # the conformance gates -- the same independence the `macos` job's gates
      # have from its self-tests.
      - name: Install the AU so the AudioComponent registry can find it
        id: au_install
        if: ${{ !cancelled() && steps.thin.outcome == 'success' }}
        run: |
          set -e
          DEST="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$DEST"
          rm -rf "$DEST/Anamorph.component"
          cp -R build/Anamorph_artefacts/Release/AU/Anamorph.component "$DEST/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          echo "bundle=$DEST/Anamorph.component" >> "$GITHUB_OUTPUT"
          ls -d "$DEST/Anamorph.component"

      # BOTH MODES, BOTH FORMATS, x3 EACH -- the same gate the other three
      # platforms are held to, at the same single-source strictness. The sibling
      # runs deterministic only on its Intel job; that is the one place this
      # implementation deliberately does not follow it. Uniformity is a stated
      # property of this workflow ("Validation is UNIFORM across all three
      # platforms and BLOCKING on each", top of file), and a fourth platform
      # quietly running half the gate would make that sentence false. It also
      # buys something specific: `randomise` draws a FRESH seed per run, so the
      # values the tests push through the plug-in differ every time -- and on
      # this job they go through Intel-generated code on an Intel FPU, a
      # (architecture x value) space neither the Intel deterministic run nor the
      # arm64 randomise run reaches. ~5 of this job's ~26 minutes.
      #
      # Each step names its producer and carries `!cancelled()`, so no single
      # gate's failure can skip another's report -- the rule the whole file
      # follows, and never a bare `!cancelled()`, which is true after ANY
      # upstream failure and would have pluginval report "not found -- build
      # first" as though that were the fault. For the VST3 the named producer is
      # `thin`, not `build`: it carries no `if:` of its own, so it runs only on a
      # successful build and subsumes it -- the same relationship the `linux`
      # job's `strip` has to its build, and it additionally means an arm64 or fat
      # binary cannot be validated and then reported as an Intel result. For the
      # AU it is `au_install`, which gates on `thin` and so carries that too.
      - name: pluginval VST3 (deterministic x3), native Intel
        if: ${{ !cancelled() && steps.thin.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: build/Anamorph_artefacts/Release/VST3/Anamorph.vst3
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} deterministic vst3

      - name: pluginval VST3 (randomise x3), native Intel
        if: ${{ !cancelled() && steps.thin.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: build/Anamorph_artefacts/Release/VST3/Anamorph.vst3
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} randomise vst3

      - name: pluginval AU (deterministic x3), native Intel
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} deterministic au

      - name: pluginval AU (randomise x3), native Intel
        if: ${{ !cancelled() && steps.au_install.outcome == 'success' }}
        env:
          ANAMORPH_PLUGINVAL_BUNDLE: ${{ steps.au_install.outputs.bundle }}
        run: ./scripts/run-pluginval.sh ${{ env.ANAMORPH_PLUGINVAL_STRICTNESS }} randomise au

      # Leave the runner as we found it -- same reasoning as the `macos` job:
      # `TESTING.md` tells a human to reproduce these steps locally, and an
      # install into a real ~/Library/Audio/Plug-Ins/Components that nothing
      # removes is a surprise worth not shipping in the instructions.
      - name: Remove the AU installed for validation
        if: ${{ !cancelled() && steps.au_install.outcome != 'skipped' }}
        run: rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Anamorph.component"

  # -------------------------------------------------------------------------
  # LTO validation (Linux). The ONLY place any behavioural assertion runs
  # against link-time-optimized codegen.
  #
  # The shipped plugin links `juce::juce_recommended_lto_flags` (plain `-flto`
  # on GCC Release); both self-test suites DELIBERATELY do not (CMakeLists.txt
  # keeps them un-LTO'd so the sanitizers job builds them cleanly and quickly).
  # Until this job, that meant the 156 + 900 checks -- including every DSP
  # numeric invariant -- had only ever executed non-LTO objects, while the
  # binary users load is the LTO'd one; pluginval exercises those shipped bytes
  # but asserts host conformance, not numerics. This job closes that gap: the
  # same two suites, built with the same `-flto` spelling the shipped target
  # gets, under the compatibility compiler rather than the shipping one.
  #
  # The flags arrive VIA THE CACHE VARIABLES on purpose. Linking
  # `juce_recommended_lto_flags` into the test targets would say the same thing
  # more directly, but that is a CMake-structure change and therefore a gated
  # Build System change (ARCHITECTURE_REVIEW_GATE.md); this workflow-only form
  # validates the identical flag with no repository decision spent. Measured on
  # a 4-core machine: ~4.6 min cold (the AnamorphStateTests LTO link dominates
  # -- plain `-flto` runs its LTRANS stage serially, which is also true of the
  # shipped plugin link in the `linux` job).
  #
  # NOT in any `needs:` chain, same as `sanitizers` and with the same scope: a
  # validation finding does not withhold the per-push beta artifact the
  # behavioural gates passed. On the RELEASE path it does block, because
  # `release.yml` depends on this workflow's aggregate result -- see the
  # `sanitizers` comment above for the full topology.
  # ============================================================================
  #  windows-avx2-ab -- ADR-0032's BLOCKING Class-A gate. The shipped Windows
  #  build compiles /arch:AVX2 at the default non-contracting /fp:precise, and
  #  that Class-A property is a TOOLSET-VERSION BEHAVIOUR on a floating runner
  #  image -- so it is asserted on every push rather than remembered from the
  #  adoption evidence (0/32 on toolset 14.51.36231, two runs). This job began
  #  life as the R-1 reporting-only experiment that produced that evidence;
  #  ADR-0032 promoted it, which was an explicit adoption requirement.
  #
  #  THE GATE: A (baseline, ANAMORPH_X86_ISA_BASELINE=OFF -> SSE2) must be
  #  bit-identical to B (the SHIPPED configuration -- /arch:AVX2 via
  #  AnamorphHardening, the same mechanism the customer binary is built with)
  #  across all 32 twin-dump scenarios. Any scenario differing is a NUMERICAL
  #  failure of the ADR-0032 contract and fails the job.
  #
  #  TWO FAILURE CLASSES, DELIBERATELY DISTINGUISHED in the error text so a red
  #  run can never read as the wrong thing:
  #    * "NUMERICAL:" -- the comparison RAN and A != B. The Class-A contract is
  #      broken (a toolset moved the vectorizer/contraction behaviour, or a
  #      code change interacts with /arch:AVX2). Never re-run past this;
  #      diagnose it.
  #    * "INFRASTRUCTURE:" -- the gate could not run (checkout, JUCE fetch,
  #      build, self-check, parse). This also FAILS the job, fail-closed and on
  #      purpose: no other job verifies the property, so a gate that cannot run
  #      must not pass -- exactly as a `windows` build failure blocks. The
  #      label is what stops it being mistaken for a numerical regression.
  #  A job TIMEOUT is an infrastructure failure by definition (the runner kills
  #  the job before any comparison; no numerical claim is implied).
  #
  #  C (/arch:AVX2 /fp:contract) is INFORMATIONAL ONLY and has no effect on the
  #  exit code: 32/32 differing under contraction is an observation about what
  #  /fp:contract would do, not a contract -- the flag is NOT enabled anywhere
  #  (ADR-0032 option 3). A C-side failure degrades to a ::warning::.
  #
  #  SELF-PROOF THE FLAG IS LIVE: 0/32 would be trivially true if /arch:AVX2
  #  silently failed to apply to B, so the job asserts the flag IS in B's
  #  generated build files and IS NOT in A's before comparing. The dump target
  #  deliberately excludes LTO; JUCE is fetched once (build A) and reused via
  #  ANAMORPH_JUCE_PATH, the macos-crossslice pattern.
  windows-avx2-ab:
    runs-on: windows-latest
    timeout-minutes: 60
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Blocking A/B twin dump -- baseline vs the shipped /arch:AVX2 configuration (ADR-0032)
        shell: pwsh
        run: |
          # Failure taxonomy (see the job header): "NUMERICAL:" means the
          # comparison ran and the ADR-0032 contract is broken; every other
          # failure is "INFRASTRUCTURE:" -- the gate could not run, which also
          # fails (fail-closed; no other job verifies this property) but must
          # never read as a numerical regression. C is informational only.
          $ErrorActionPreference = 'Continue'
          function Say([string]$m) { Write-Host $m; Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $m }
          function Die-Infra([string]$m) {
            Write-Host "::error::INFRASTRUCTURE: $m (the ADR-0032 gate could not run -- fail-closed; this is NOT a numerical failure)"
            Say "- **INFRASTRUCTURE failure:** $m"
            exit 1
          }
          Say "## windows-avx2-ab -- ADR-0032 blocking Class-A gate (baseline vs shipped /arch:AVX2)"

          function Build-Dump([string]$dir, [string[]]$extra, [string]$jucePath) {
            $args = @('-B', $dir, '-DANAMORPH_BUILD_DSPDUMP=ON', '-DANAMORPH_BUILD_TESTS=OFF',
                      '-DANAMORPH_BUILD_STANDALONE=OFF') + $extra
            if ($jucePath -ne '') { $args += "-DANAMORPH_JUCE_PATH=$jucePath" }
            cmake @args | Out-Null
            if ($LASTEXITCODE -ne 0) { return $false }
            cmake --build $dir --config Release --target AnamorphDspDump | Out-Null
            return ($LASTEXITCODE -eq 0)
          }
          function Run-Dump([string]$dir, [string]$out) {
            $exe = Join-Path $dir 'AnamorphDspDump_artefacts/Release/AnamorphDspDump.exe'
            if (-not (Test-Path $exe)) { return 'missing' }
            & $exe --self-check *> $null
            if ($LASTEXITCODE -ne 0) { return 'self-check' }
            & $exe > $out 2>&1
            if ($LASTEXITCODE -ne 0) { return 'run' }
            return 'ok'
          }
          function Read-Dump([string]$f) {
            # The dump prints its self-check verdict to stdout AHEAD of the
            # table; on this job's first-ever run that line was counted as a
            # 33rd "scenario" (the A7-5E blank-line lesson, one format over).
            # Only rows whose second field is the 16-hex fnv1a hash are data.
            $m = @{}
            foreach ($line in Get-Content $f) {
              if ($line -and -not $line.StartsWith('#')) {
                $p = ($line -split '\s+') | Where-Object { $_ }
                if ($p.Count -ge 2 -and $p[1] -match '^[0-9a-f]{16}$') { $m[$p[0]] = $p[1] }
              }
            }
            return $m
          }
          function Flag-Count([string]$dir) {
            # Self-proof the flag is live: /arch:AVX2 must appear in B's
            # generated VS project files and not in A's, else 0/32 is trivial.
            return @(Get-ChildItem -Path $dir -Recurse -Filter '*.vcxproj' |
                     Select-String -Pattern 'AdvancedVectorExtensions2|/arch:AVX2' -List).Count
          }

          # A = baseline (the option now governs MSVC too -- ADR-0032);
          # B = the SHIPPED configuration, flag via AnamorphHardening itself.
          if (-not (Build-Dump 'build-a' @('-DANAMORPH_X86_ISA_BASELINE=OFF') '')) { Die-Infra 'build A (baseline, ANAMORPH_X86_ISA_BASELINE=OFF) failed' }
          $juce = Join-Path $PWD 'build-a/_deps/juce-src'
          if (-not (Test-Path $juce)) { $juce = '' }
          if (-not (Build-Dump 'build-b' @() $juce)) { Die-Infra 'build B (shipped configuration, /arch:AVX2 via AnamorphHardening) failed' }

          # Toolset record: the same 14.30 boundary the windows job asserts.
          $version = $null
          foreach ($key in 'CMAKE_CXX_COMPILER:FILEPATH', 'CMAKE_LINKER:FILEPATH') {
            $hit = (Select-String -Path 'build-b/CMakeCache.txt' -Pattern ('^' + [regex]::Escape($key)) | Select-Object -First 1)
            if ($null -ne $hit -and $hit.Line -match 'MSVC[\\/]+([0-9]+(\.[0-9]+)+)') { $version = $Matches[1]; break }
          }
          if ($null -eq $version) { Die-Infra 'MSVC toolset version unreadable from build-b/CMakeCache.txt -- the result would be unplaceable against the 14.30 contraction boundary' }
          $minor = [int]($version.Split('.')[1])
          if ($version.Split('.')[0] -ne '14' -or $minor -lt 30) { Die-Infra "MSVC toolset $version is outside the asserted 14.30+ series -- the non-contracting /fp:precise default ADR-0032 rests on is not established here" }
          Say "- MSVC toolset **$version** (14.30+ non-contracting /fp:precise default: YES)"
          Say "- A = ``ANAMORPH_X86_ISA_BASELINE=OFF`` (SSE2 baseline, /fp:precise) | B = shipped configuration (``/arch:AVX2`` via AnamorphHardening, default /fp:precise)"

          $fa = Flag-Count 'build-a'; $fb = Flag-Count 'build-b'
          if ($fb -eq 0) { Die-Infra '/arch:AVX2 not found in any build-b project file -- the flag did not apply, so an identical A/B would be vacuous' }
          if ($fa -ne 0) { Die-Infra '/arch:AVX2 found in build-a (the baseline) -- ANAMORPH_X86_ISA_BASELINE=OFF did not take effect, so the A/B compares nothing' }
          Say "- flag liveness: ``/arch:AVX2`` in $fb build-b project file(s), 0 in build-a -- the comparison is real"

          $ra = Run-Dump 'build-a' 'd-a.txt'; if ($ra -ne 'ok') { Die-Infra "dump A did not execute cleanly ($ra)" }
          $rb = Run-Dump 'build-b' 'd-b.txt'; if ($rb -ne 'ok') { Die-Infra "dump B did not execute cleanly ($rb)" }

          $A = Read-Dump 'd-a.txt'; $B = Read-Dump 'd-b.txt'
          if ($A.Count -ne 32 -or $B.Count -ne 32) { Die-Infra "parsed $($A.Count) baseline / $($B.Count) shipped scenarios where 32 were expected -- the dump format or parser moved" }

          $diff = @()
          foreach ($n in ($A.Keys | Sort-Object)) { if ($A[$n] -ne $B[$n]) { $diff += $n } }
          if ($diff.Count -ne 0) {
            Say "- **NUMERICAL GATE FAILURE: $($diff.Count) of 32 scenarios differ** between the baseline and the shipped /arch:AVX2 configuration"
            Say "  differing: $($diff -join ', ')"
            Write-Host "::error::NUMERICAL: the ADR-0032 Class-A contract is broken -- $($diff.Count)/32 twin-dump scenarios differ between baseline and /arch:AVX2 on toolset $version. This is a real numerical regression, not an infrastructure failure: do not re-run past it, diagnose it (a toolset behaviour change, or a code change interacting with /arch:AVX2)."
            exit 1
          }
          Say "- **A == B: IDENTICAL -- all 32 scenarios agree.** The ADR-0032 Class-A contract holds on toolset $version."
          Write-Host "::notice::windows-avx2-ab: ADR-0032 gate PASSED -- 0/32 scenarios differ (toolset $version)"

          # C (/arch:AVX2 /fp:contract) -- INFORMATIONAL ONLY, never affects
          # the exit code. 32/32 differing is the expected observation about
          # contraction (ADR-0032 option 3); a C-side failure is a warning.
          if (Build-Dump 'build-c' @('-DCMAKE_CXX_FLAGS=/fp:contract') $juce) {
            $rc = Run-Dump 'build-c' 'd-c.txt'
            if ($rc -eq 'ok') {
              $C = Read-Dump 'd-c.txt'
              $cd = @(); foreach ($n in ($B.Keys | Sort-Object)) { if ($B[$n] -ne $C[$n]) { $cd += $n } }
              Say "- informational: /fp:contract moves $($cd.Count) of 32 scenarios (contraction remains the bit-moving half; the flag is NOT enabled anywhere)"
            } else { Write-Host "::warning::informational /fp:contract dump did not execute cleanly ($rc) -- the blocking gate above is unaffected"; Say "- informational /fp:contract run skipped ($rc)" }
          } else { Write-Host "::warning::informational /fp:contract build failed -- the blocking gate above is unaffected"; Say "- informational /fp:contract build skipped" }
          exit 0

  linux-lto-tests:
    # GCC IS THE COMPATIBILITY COMPILER, NOT THE SHIPPING ONE. Clang builds the
    # artifact (`linux`); this job exists so the tree keeps compiling, and its
    # invariants keep holding, under the other major toolchain -- and so the two
    # GCC-only diagnostics survive (see the gate block above the jobs).
    #
    # THE TAG FLOATS ON THE MAJOR, deliberately, and it is the one pin in this
    # file that is not exact. `gcc:16` resolves to the newest 16.x the official
    # image publishes, so patch releases arrive without a commit here -- which is
    # what a compatibility checker wants and what a shipping toolchain must not
    # have. Nothing downstream needs the patch: `gcc-warning-baseline.txt`
    # records the MAJOR, and the step below asserts the major rather than a full
    # version, so a 16.2 -> 16.3 move is silent and a 17 move is loud.
    #
    # WHY AN IMAGE AND NOT `apt`, which every other Linux toolchain here uses:
    # no package source ships a stable GCC 16. Noble stops at `g++-14`; the only
    # `g++-16` in `ubuntu-toolchain-r/test` is a trunk snapshot (`16-20260315`),
    # and Ubuntu 26.04 carries the same class (`16-20260322`) -- both predate the
    # 16.1 release and are exactly the "newest, not stable" that ADR-0028
    # rejects. Stable 16.2.0 exists in apt only for an unreleased Ubuntu series.
    # The official image is the only package-managed route to a RELEASED GCC 16.
    runs-on: ubuntu-latest
    container:
      image: gcc:16
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No compiler in `extra-packages`: the container IS the compiler, so there
      # is nothing to install and nothing that could resolve to a different one.
      #
      # `headless`, because this is the one job whose dependencies are NOT the
      # ones a fresh Ubuntu machine needs. It builds two test targets and no GUI,
      # so the pluginval fetch/display pair and lld are dead weight here -- and
      # `build-essential` is worse than dead weight: it would install a
      # distribution GCC over the top of the pinned one this container exists to
      # provide. The profile also names `python3` explicitly, which matters here
      # and nowhere else: the warning gate is a Python script, and this image
      # carries an interpreter only transitively.
      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          dependency-profile: headless

      # Asserted before the build so the log carries the version the baseline is
      # compared against. The MAJOR only, matching what the tag pins and what the
      # baseline records: a 16.2 -> 16.3 move must pass here, and a tag that ever
      # resolved to 17 must fail here rather than twenty minutes later inside
      # `check-gcc-warnings.py` with a baseline mismatch.
      - name: Assert the container is the pinned GCC major
        run: |
          set -eu
          g++ --version | head -1
          got="$(g++ -dumpversion)"
          [ "${got%%.*}" = "${ANAMORPH_GCC_VERSION}" ] || {
            echo "::error::container g++ is ${got}, env declares major ${ANAMORPH_GCC_VERSION}"
            exit 1
          }

      # Its own lineage: `-flto` objects are GIMPLE bytecode under GCC, so they
      # share no cache entries with the `linux` job's native objects; a shared
      # lineage would only have the two evict each other.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-gcc${{ env.ANAMORPH_GCC_VERSION }}-lto-${{ github.run_id }}
          restore-keys: ccache-ubuntu-gcc${{ env.ANAMORPH_GCC_VERSION }}-lto-

      # THE GATED WARNING FLAGS COME FROM THE SCRIPT, not from this file. They
      # are GCC-only diagnostics that `juce_recommended_warning_flags` does not
      # turn on for either compiler, so they have to be added by hand somewhere
      # -- and the one place they must not be written twice is here, because a
      # flag present in the build but unknown to the gate is a warning nobody
      # counts, and a flag known to the gate but absent from the build is a
      # baseline entry that can never be reproduced.
      #
      # None of them affect codegen, so the LTO objects this job exists to test
      # are byte-identical with and without them; and all five are FRONT-END
      # diagnostics, emitted while compiling each TU, so `-flto` neither hides
      # nor invents any of them. (That is also why the post-inlining
      # `-Wnull-dereference` is deliberately not in the set -- under LTO its
      # answer would depend on link-time inlining decisions. The script's header
      # gives the full reasoning for both exclusions.)
      - name: Configure (GCC, -flto on the test suites)
        run: |
          ccache --zero-stats || true
          GCC_WARNINGS="$(python3 scripts/check-gcc-warnings.py --print-flags)"
          echo "Gated GCC-only warnings: ${GCC_WARNINGS}"
          cmake -B build-lto -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_FLAGS="-flto" \
            -DCMAKE_CXX_FLAGS="-flto ${GCC_WARNINGS}" \
            -DCMAKE_EXE_LINKER_FLAGS="-flto" \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DANAMORPH_BUILD_STANDALONE=OFF \
            -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      # PROVE THE GATE IS LIVE BEFORE TRUSTING ITS SILENCE -- the same move
      # `check-clang-warnings.py --self-test`, `check-docs.py --self-test` and
      # the portability canary make, for the same reason: a checker that has
      # stopped matching anything is indistinguishable from a clean tree. The
      # cases feed the real classifier every path spelling this build could
      # produce and both directions of the baseline comparison.
      - name: GCC warning-gate self-test (the classifier still classifies)
        run: python3 scripts/check-gcc-warnings.py --self-test

      # THESE TWO TARGETS ARE THE WHOLE FIRST-PARTY SURFACE, which is what makes
      # this the right job to carry the gate rather than a job of its own:
      # AnamorphStateTests compiles ${ANAMORPH_PLUGIN_SOURCES} (every src/*.cpp
      # outside dsp/) and both targets compile src/dsp/*.cpp through the
      # AnamorphDSP INTERFACE library, so between them every first-party
      # translation unit the gate can speak about is built here already. The
      # gate therefore costs one `tee` and one python invocation, not a runner.
      - name: Build test targets (LTO), gating on first-party GCC warnings
        run: |
          set -o pipefail
          cmake --build build-lto --target AnamorphTests AnamorphStateTests 2>&1 | tee gcc-build.log
          # Classification is STRUCTURAL rather than textual, for the reason the
          # Clang gate's step spells out: every diagnostic's path is resolved and
          # asked whether it lands under src/ or tests/ without passing through a
          # `_deps` component, so a generator or wrapper change cannot silently
          # turn this into a step that passes forever with zero coverage.
          # `--gcc-major` is checked against the version recorded IN the baseline:
          # a mismatch exits 2 ("the check could not run"), never 1 ("the tree
          # regressed"), because that is what it is.
          python3 scripts/check-gcc-warnings.py \
            --log gcc-build.log \
            --root "${GITHUB_WORKSPACE}" \
            --build-dir "${GITHUB_WORKSPACE}/build-lto" \
            --gcc-major "${ANAMORPH_GCC_VERSION}"

      - name: Self-tests against LTO codegen
        run: |
          ./build-lto/AnamorphTests_artefacts/Release/AnamorphTests
          ./build-lto/AnamorphStateTests_artefacts/Release/AnamorphStateTests

      # THE BENCHMARK IS BUILT AND SMOKE-RUN HERE, AND IT ASSERTS NO TIMING.
      # That is a measured decision, not caution: across five independent
      # invocations of the same cell on an IDLE machine, the median ns/sample
      # moved 7.2% and the worst-block figure moved 65.4%. A shared CI runner is
      # noisier than that, so any threshold wide enough not to fail spuriously
      # would only catch regressions the correctness suites' own runtime already
      # makes obvious. PERFORMANCE_BUDGET.md records the numbers and the rule.
      #
      # What this step DOES buy is the thing a committed harness can actually
      # guarantee: that it still compiles against the current engine API and
      # still runs. A benchmark nobody builds silently stops matching the code
      # it measures, which is precisely how the Wave 3-6 scratch harnesses were
      # lost. The real measurement is a deliberate local run at full length.
      #
      # It builds in THIS job because the bench links `juce_recommended_lto_flags`
      # -- the shipped optimization class the budget document requires it to
      # measure -- so the LTO lane is where those flags are already in use.
      #
      # THE FLAGS ARE THE SHIPPED ONES; THE COMPILER IS NOT. This job runs in
      # the `gcc:16` container and the configure below names no compiler, so the
      # bench is compiled here by g++ 16 while the shipped Linux artifact is
      # built by clang-22 in `linux`. That is deliberate -- what a benchmark
      # needs held constant is the optimization class, and pinning it to the
      # shipping compiler would mean building it where the release artifact is
      # built and slowing that job for a harness that asserts no timing. The
      # half this cannot cover is covered where it belongs: `linux` compiles
      # both instruments `-fsyntax-only` under the pinned Clang, so a
      # Clang-only break still fails a gate.
      #
      # BOTH SECONDARY BUILDS REUSE THE JUCE THIS JOB ALREADY FETCHED, via the
      # `ANAMORPH_JUCE_PATH` escape hatch CMakeLists.txt already carries. Each
      # `cmake -B` otherwise runs its own FetchContent clone into its own
      # `_deps`, so this job was fetching the same pinned commit THREE times.
      # Nothing is cached and nothing crosses runs: the source is the tree this
      # job downloaded minutes earlier, at the SHA the build definition pins, and
      # a missing directory fails `add_subdirectory` loudly rather than silently
      # re-fetching.
      #
      # A CROSS-RUN `actions/cache` FOR JUCE WAS MEASURED AND DECLINED, which is
      # the roadmap item this closes. The clone is already `GIT_SHALLOW` at a
      # pinned commit: a fetch of exactly that commit measured 5.0 s for a 120 MB
      # tree. The cache it would be replaced by is 44 MB compressed and took
      # 2.6 s to decompress and extract before any download -- so a cache HIT
      # saves something like a second and a half, against eleven jobs whose
      # runtimes are 6 to 21 minutes, while adding a key to maintain and a way
      # for the release path to build against the wrong bytes. The waste worth
      # removing was never the per-job clone; it was this job fetching the same
      # commit three times in one run, which needs no cache at all.
      - name: Build + smoke-run the benchmark harness (no timing assertion)
        run: |
          cmake -B build-bench -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANAMORPH_BUILD_BENCH=ON -DANAMORPH_BUILD_TESTS=OFF \
            -DANAMORPH_BUILD_STANDALONE=OFF \
            -DANAMORPH_JUCE_PATH="${GITHUB_WORKSPACE}/build-lto/_deps/juce-src" \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          cmake --build build-bench --target AnamorphBench
          # Deliberately tiny: this proves the harness runs, not what it costs.
          ANAMORPH_BENCH_SECONDS=0.1 ANAMORPH_BENCH_REPS=1 \
            ./build-bench/AnamorphBench_artefacts/Release/AnamorphBench

      # THE OTHER COMMITTED INSTRUMENT, AND THE ARGUMENT IS THE BENCH'S OWN.
      # `AnamorphDspDump` is the DEPENDENCY_POLICY rule-2 gate for a JUCE bump,
      # and until this step no job built it -- the one committed harness with no
      # protection against exactly the rot the bench step above exists to
      # prevent. Two bumps have already been proved with a scratchpad tool that
      # was never committed; this one was committed so the third would not have
      # to rebuild it, which only holds if it still compiles when that day comes.
      #
      # `--self-check` RATHER THAN A BARE RUN, and it is the stronger check.
      # The tool's own argument is that a scenario set which collapses reports
      # 32 confident and meaningless hashes -- which is what the 8.0.14 -> 9.0.0
      # run shipped, with `algoAmount` left at its identity default so all four
      # algorithms hashed alike. `--self-check` asserts every scenario is
      # REPEATABLE and that they are DISTINCT from each other, and exits 3 if
      # not. So this step proves the instrument still builds AND that it can
      # still discriminate; a bare run would prove only the first.
      #
      # NO BASELINE AND NOTHING TO DIFF HERE, deliberately. The tool answers
      # "does build A match build B", never "does this match a stored value" --
      # committing expected hashes would be the golden-master DSP test this
      # repository has rejected. The diff is a human's, at bump time,
      # `docs/procedures/TESTING.md` §Proving a dependency bump is bit-identical.
      #
      # It does NOT carry `juce_recommended_lto_flags` (CMakeLists.txt says why:
      # LTO is a second variable), so unlike the bench it is not measuring the
      # shipped optimization class and its presence in this job is incidental
      # rather than required -- it is here because this is where the other
      # instrument's liveness step already lives.
      - name: Build + self-check the DSP bit-identity harness
        run: |
          cmake -B build-dump -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DANAMORPH_BUILD_DSPDUMP=ON -DANAMORPH_BUILD_TESTS=OFF \
            -DANAMORPH_BUILD_STANDALONE=OFF \
            -DANAMORPH_JUCE_PATH="${GITHUB_WORKSPACE}/build-lto/_deps/juce-src" \
            -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }} \
            -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          cmake --build build-dump --target AnamorphDspDump
          ./build-dump/AnamorphDspDump_artefacts/Release/AnamorphDspDump --self-check

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

  # -------------------------------------------------------------------------
  # RealtimeSanitizer (Linux). The first mechanical detector for
  # REALTIME_AUDIO_POLICY -- the repository's Priority-1 policy, which until
  # ADR-0029 was enforced only by review and a hand-written audit.
  #
  # WHAT IT CATCHES THAT NOTHING ELSE HERE DOES. ASan finds out-of-bounds and
  # lifetime bugs, UBSan finds undefined behaviour, valgrind finds
  # uninitialised reads. A `malloc` added to `AnamorphEngine::process` is, to
  # every one of them, a perfectly correct allocation. RTSan is the only tool
  # in this pipeline that asks WHERE it happened.
  #
  # ITS OWN JOB, and that is forced rather than chosen: the clang driver
  # rejects `-fsanitize=realtime` combined with `address`, `undefined`, this
  # pipeline's actual `address,undefined,vptr` set, or `thread` -- "invalid
  # argument ... not allowed with ...". It cannot be folded into `sanitizers`.
  #
  # NO `RTSAN_OPTIONS` IS SET, and that is the load-bearing part of the gate.
  # RTSan halts on the first violation BY DEFAULT (exit 43). The one setting
  # that would quietly break this job is `halt_on_error=false`, under which the
  # process prints its violation reports and still exits 0 -- a step that
  # reports and passes. Do not add it here or to the job env.
  #
  # Only the DSP suite runs: it drives the audio path across the whole feature
  # matrix, which is what a runtime tool's coverage is made of. ADR-0029 has
  # the full strategy, including what is deliberately NOT here
  # (`-Wfunction-effects`, measured at 52 warnings from opaque JUCE calls) and
  # what comes next (the allocation guard, for the platforms RTSan cannot reach).
  #
  # NOT in any `needs:` chain, matching `sanitizers` and `linux-lto-tests` --
  # and, like them, still release-blocking through `release.yml`'s aggregate
  # dependency on this workflow (see the `sanitizers` comment for the topology).
  realtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANAMORPH_CLANG_VERSION }}

      # Its own lineage, keyed on the pinned Clang major like the other two
      # Clang jobs: `-fsanitize=realtime` objects share no cache entries with
      # theirs, so a shared lineage would only have them evict each other.
      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-realtime-clang${{ env.ANAMORPH_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-realtime-clang${{ env.ANAMORPH_CLANG_VERSION }}-

      # THE LIVENESS PROOF, and it runs BEFORE the thing it vouches for
      # (TESTING_POLICY rule 4, the same shape as the four lints' --self-tests).
      # This job's entire output on a healthy tree is "no violations", which is
      # also exactly what a job whose instrumentation stopped working prints.
      # The canary commits a real, escaping allocation inside a nonblocking
      # function: if THAT is not reported, the silence below means nothing.
      # Both halves are asserted -- a non-zero exit AND the report itself, so a
      # canary that died for some unrelated reason cannot pass for a live gate.
      - name: RealtimeSanitizer liveness canary (the lane must be able to fail)
        run: |
          clang++-${{ env.ANAMORPH_CLANG_VERSION }} -std=c++23 -O2 -g \
            -fsanitize=realtime tests/realtime_canary.cpp -o rtsan-canary
          if ./rtsan-canary > rtsan-canary.log 2>&1; then
            echo "::error::the RealtimeSanitizer canary exited 0 -- this lane is not instrumenting anything"
            cat rtsan-canary.log
            exit 1
          fi
          # The REPORT SIGNATURE, not a bare word: an earlier draft grepped for
          # "RealtimeSanitizer", which the canary's own failure message also
          # contained -- so an uninstrumented build satisfied this assertion.
          if ! grep -q "ERROR: RealtimeSanitizer" rtsan-canary.log; then
            echo "::error::the canary aborted, but not with a RealtimeSanitizer report"
            cat rtsan-canary.log
            exit 1
          fi
          echo "canary reported its seeded violation -- the lane is live"

      # `-DANAMORPH_RTSAN_LANE=1` RIDES ON THE SAME FLAG STRING as
      # `-fsanitize=realtime`, and that adjacency is the point: it is this job
      # declaring, from outside the compiler, which lane it is.
      # `tests/AllocationGuard.h` stands the allocation guard down under
      # `__has_feature(realtime_sanitizer)` -- a single spelling that, if a
      # future Clang renames or drops it, would silently compile the guard back
      # in, where its allocation definitions take precedence over RTSan's
      # interceptors and the lane loses its ALLOCATION detection while exiting 0
      # on a healthy tree (ADR-0029 SS7; lock and blocking-call interception
      # survives, and the header's seeded measurement exits 1 from the guard's
      # own assert rather than 0 -- it is the UNSEEDED run that goes green over
      # nothing). The header turns the two statements into a build-level
      # invariant and #errors if they disagree, so that mutation fails the build
      # instead of hollowing out the lane. Do not remove this define to make a
      # build pass -- it is the check, not the cause.
      - name: Configure (Clang, RealtimeSanitizer)
        run: >
          ccache --zero-stats || true &&
          cmake -B build-rtsan -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_C_FLAGS="-fsanitize=realtime -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=realtime -fno-omit-frame-pointer -DANAMORPH_RTSAN_LANE=1"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=realtime"
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DANAMORPH_BUILD_STANDALONE=OFF
          -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      # COMPILE-TIME effect verification for the first-party leaf layer, and the
      # one tier that follows a CALL. RTSan and the allocation guard are runtime
      # tools (they see what the suite executes); `check-realtime.py` is a text
      # scan (it sees constructs written literally in an audio-path body).
      # Neither catches a leaf that calls an allocating helper defined
      # elsewhere -- `-Wfunction-effects` does, through the call graph.
      #
      # SCOPED TO ONE TU, NOT THE BUILD. Enabling the flag over
      # `AnamorphEngine.cpp` produces 52 warnings, essentially all JUCE calls
      # whose definitions that TU cannot see; JUCE 9.0.1 carries no annotations
      # of its own, so those are warnings about correct code (ADR-0029 records
      # the decision not to enable it build-wide). `tests/realtime_effects.cpp`
      # includes only the JUCE-free first-party leaves, where the signal is
      # clean: measured 0 diagnostics on this tree, and the seeded
      # `ANAMORPH_EFFECTS_CANARY` call to an ALLOCATING helper fails the compile.
      # (Being unannotated is not what fails: Clang infers a callee's effects
      # wherever its DEFINITION is visible in the TU, so the driver's own call to
      # the unannotated, header-defined `anamorph::applyWidth` diagnoses nothing.)
      #
      # Runs AFTER configure because it needs the FetchContent'd JUCE headers
      # (`LR4Xover.h` includes `juce_dsp`). `-fsyntax-only`: no link, no run.
      #
      # TWO COMPILES, because a clean one proves nothing on its own. Clang
      # treats an unrecognised `-Werror=<name>` as a `-Wunknown-warning-option`
      # WARNING rather than an error, so if `function-effects` is ever renamed
      # or dropped this step would keep exiting 0 while checking nothing --
      # measured on the pinned Clang 22.1.8: with the option misspelled, a TU
      # carrying a real seeded violation compiles with status 0. Every other
      # SILENT CHECKER in this workflow carries an in-job liveness proof -- the
      # RTSan canary, the four lints' `--self-test`s, the ABI-floor self-test,
      # the two warning gates' baseline comparisons -- and this is that proof
      # for this one. (Not every GATE has one: the ten pluginval steps do not,
      # and `TESTING_POLICY.md` rule 4 does not ask them to.)
      #
      # THE CANARY IS THE COVERAGE; `-Werror=unknown-warning-option` IS THE
      # DIAGNOSIS. Measured, because the first version of this comment claimed
      # they were independent and they are not: a name Clang no longer knows is
      # also a diagnostic Clang no longer emits, so the canary compiles clean and
      # fails the step in that case too. The flag earns its place by failing on
      # the FIRST compile and naming the cause, instead of leaving a reader to
      # infer a rename from "the canary compiled". The canary alone still covers
      # the case the flag never can -- an option accepted but no longer
      # implemented -- plus three this comment did not originally claim: a
      # silently-empty `ANAMORPH_NONBLOCKING` (it is `__has_cpp_attribute`
      # guarded), a `#pragma clang diagnostic ignored` planted in the include
      # set, and the driver being compiled out.
      #
      # ONE SIDE EFFECT OF THE FLAG, so it is not deleted in puzzlement later:
      # it also promotes PRAGMA-sourced unknown warning groups to errors. Adding
      # a first-party header to this TU that carries
      # `#pragma clang diagnostic ignored "-Wsomething"` for a GCC-only or
      # newer-Clang name will fail the step. JUCE's own suppressions are safe --
      # `juce_CompilerWarnings.h` gates every one behind `__has_warning`, so the
      # three names this Clang does not know expand to nothing.
      #
      # The canary is the SAME translation unit with `-DANAMORPH_EFFECTS_CANARY`
      # seeding a call to an allocating, unannotated helper, so it exercises the
      # real include set and the real flags rather than a toy beside them. The
      # diagnostic is matched on its FLAG ATTRIBUTION (`-Wfunction-effects`),
      # not on prose: a canary that failed to compile for some unrelated reason
      # must not read as a live gate -- the same trap the RTSan canary above
      # documents having fallen into once.
      - name: Realtime effect diagnostics (first-party leaf layer)
        run: |
          clang++-${{ env.ANAMORPH_CLANG_VERSION }} -std=c++23 -O2 \
            -I src -I src/dsp -I build-rtsan/_deps/juce-src/modules \
            -DJUCE_GLOBAL_MODULE_SETTINGS_INCLUDED=1 -DJUCE_STANDALONE_APPLICATION=1 \
            -Werror=unknown-warning-option \
            -Werror=function-effects -fsyntax-only tests/realtime_effects.cpp

          if clang++-${{ env.ANAMORPH_CLANG_VERSION }} -std=c++23 -O2 \
               -I src -I src/dsp -I build-rtsan/_deps/juce-src/modules \
               -DJUCE_GLOBAL_MODULE_SETTINGS_INCLUDED=1 -DJUCE_STANDALONE_APPLICATION=1 \
               -DANAMORPH_EFFECTS_CANARY \
               -Werror=unknown-warning-option \
               -Werror=function-effects -fsyntax-only tests/realtime_effects.cpp \
               > effects-canary.log 2>&1; then
            echo "::error::the function-effects canary COMPILED -- a nonblocking function calling an allocating helper was not diagnosed, so this gate is checking nothing"
            cat effects-canary.log
            exit 1
          fi
          if ! grep -q -- "-Wfunction-effects" effects-canary.log; then
            echo "::error::the function-effects canary failed, but not with a -Wfunction-effects diagnostic"
            cat effects-canary.log
            exit 1
          fi
          echo "canary reported its seeded violation -- the effects gate is live"

      - name: Build the DSP suite (RealtimeSanitizer)
        run: cmake --build build-rtsan --target AnamorphTests

      # No env: block on purpose -- see the RTSAN_OPTIONS note above.
      - name: DSP self-tests under RealtimeSanitizer
        run: ./build-rtsan/AnamorphTests_artefacts/RelWithDebInfo/AnamorphTests

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true

  # -------------------------------------------------------------------------
  # State fuzzing (Linux). libFuzzer over `setStateInformation`, the one entry
  # point where the plug-in parses bytes it did not write: a session from an
  # older version, a preset from another machine, a host that truncated a chunk.
  #
  # WHY THIS AND NOT MORE STATE FIXTURES. `AnamorphStateTests` already drives the
  # shaped cases -- three legacy fixtures, a garbage blob, an out-of-range A/B
  # index, unknown fields, a corrupt slot -- and every one of them was written
  # after a human thought of it. This is the part that does not have to think of
  # it first. The oracle is the sanitizer, not an assertion: a rejected blob is a
  # PASS, because refusing malformed state is what this path is for.
  #
  # BOUNDED, so it is a gate rather than a background service: a fixed
  # `-max_total_time` seeded from the committed corpus. It is not looking for
  # deep bugs on a 90-second budget -- it is looking for the regression that a
  # state-schema change just introduced, starting from inputs that already reach
  # the parser.
  #
  # `detect_leaks=0` IS DELIBERATE AND IS NOT A GAP: the harness leaks exactly
  # one object on purpose (JUCE's `ScopedJuceInitialiser_GUI`), because letting
  # `shutdownJuce_GUI()` run under libFuzzer's `exit()` produced a double-free in
  # `DeletedAtShutdown::deleteAll()` during `__run_exit_handlers` -- measured, on
  # the empty input, within 60 s. `tests/fuzz_state.cpp` carries the full note.
  # Leak coverage for the same code lives in the `sanitizers` job.
  #
  # NOT in any `needs:` chain, matching the other validation lanes; like them it
  # is still release-blocking through `release.yml`'s aggregate dependency.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 400M
      CCACHE_COMPILERCHECK: content
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        uses: ./.github/actions/setup-linux-build
        with:
          clang-version: ${{ env.ANAMORPH_CLANG_VERSION }}

      - name: Restore the compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-ubuntu-fuzz-clang${{ env.ANAMORPH_CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-ubuntu-fuzz-clang${{ env.ANAMORPH_CLANG_VERSION }}-

      # `-fsanitize=fuzzer` is NOT in these flags on purpose: libFuzzer's `main`
      # collides with CMake's compiler-probe program and configure fails at
      # `project()`. The target adds it itself (CMakeLists.txt); the detector
      # sanitizers belong here.
      - name: Configure (Clang, libFuzzer + ASan + UBSan)
        run: >
          ccache --zero-stats || true &&
          cmake -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_C_COMPILER=clang-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.ANAMORPH_CLANG_VERSION }}
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DANAMORPH_BUILD_FUZZ=ON
          -DANAMORPH_BUILD_TESTS=OFF
          -DANAMORPH_BUILD_STANDALONE=OFF
          -DCMAKE_C_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DCMAKE_CXX_COMPILER_LAUNCHER=${{ env.ANAMORPH_COMPILER_LAUNCHER }}
          -DANAMORPH_BUILD_NUMBER=${{ github.run_number }}

      - name: Build the fuzz target
        run: cmake --build build-fuzz --target AnamorphFuzzState

      # `-seed` IS FIXED, and it is fixed for the same reason `run-pluginval.sh`
      # fixes its own: this job is release-blocking through `release.yml`'s
      # aggregate dependency, and a release must not be able to fail on a
      # lottery. With the seed, the corpus and the budget all fixed, two runs of
      # the same commit explore the same way.
      #
      # THE BUDGET IS THE HONEST LIMIT ON THAT and is not hidden: `-max_total_time`
      # is wall-clock, so a slower runner executes fewer inputs and the tail of
      # the exploration is machine-dependent. That is deliberate -- `-runs=N`
      # would be exactly reproducible but would make the DURATION
      # machine-dependent instead, and a release gate that can overrun its
      # timeout on a slow runner is worse than one whose tail varies. The
      # consequence is stated rather than papered over: a finding here is
      # reproduced from the UPLOADED ARTIFACT, not by re-running the fuzzer.
      # The harness feeds its input to the real entry point unmodified, so those
      # bytes reproduce exactly, on any machine, forever.
      - name: Fuzz setStateInformation (bounded, fixed seed)
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p fuzz-findings
          ./build-fuzz/AnamorphFuzzState tests/fuzz-corpus \
            -seed=20260818 \
            -max_total_time=90 -rss_limit_mb=4096 -print_final_stats=1 \
            -artifact_prefix=fuzz-findings/

      # A crashing input is only useful if it leaves the machine. libFuzzer
      # writes the exact bytes that reproduce, and `tests/fuzz_state.cpp` feeds
      # the input to the real entry point unmodified -- so the artifact below is
      # a host chunk that reproduces the failure by being handed back.
      - name: Upload fuzz findings
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Anamorph-fuzz-findings
          path: fuzz-findings/
          retention-days: 14
          if-no-files-found: ignore

      - name: Compiler cache statistics
        if: ${{ !cancelled() && env.ANAMORPH_COMPILER_LAUNCHER != '' }}
        run: ccache --show-stats --verbose || true
