# CodeQL analysis for Anamorph (C++23 / JUCE audio plugin).
#
# Languages analyzed:
#   * c-cpp   -- all of src/, plus tests/dsp_tests.cpp (the two targets built
#               below). The other tests/ targets are not compiled here, so they
#               are not analysed -- the earlier "src/ + tests/" over-stated it
#               (ER-CI-06, 2026-08-31). Adding them is a scope decision, not a
#               typo fix, so the comment is corrected rather than the target list.
#   * actions -- .github/workflows/ (workflow security queries)
#
# c-cpp uses build-mode MANUAL, not "none": JUCE arrives via CMake
# FetchContent at configure time, so the bare checkout contains no framework
# headers and a no-build analysis could resolve almost none of the includes.
# The manual build mirrors the proven Linux CI steps from build.yml
# (scripts/setup-linux.sh + Ninja Release) but compiles only the VST3 and
# test targets: the Standalone format recompiles the identical translation
# units and would double extraction time for zero extra alert coverage
# (ANAMORPH_BUILD_STANDALONE is an existing CMake option, default ON).
#
# Alerts are limited to the repository's own code (config paths-ignore:
# build) -- the FetchContent'd JUCE tree lands in build/_deps inside the
# workspace and must not raise alerts we cannot act on; JUCE is pin-locked
# and review-gated per docs/policies/DEPENDENCY_POLICY.md.
#
# Query suite: the default code-scanning suite (precision-tuned). The
# security-extended suite was considered and rejected for its higher
# false-positive rate on a codebase with no untrusted-input surface
# (audio plugin: no network, no file-format parsing beyond JUCE's).
#
# Docs-only changes skip the workflow entirely -- a full compile for a
# markdown edit is pure CI cost.
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'worklogs/**'
      - 'packaging/**'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'worklogs/**'
      - 'packaging/**'
  schedule:
    - cron: '44 17 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Alert filter only (extraction still traces the full build):
          # keeps the FetchContent'd JUCE sources under build/_deps out of
          # the results. Harmless for the actions matrix entry -- nothing
          # under .github/ lives in build/.
          config: |
            paths-ignore:
              - build

      # c-cpp only. Same SOURCES as the Linux job in build.yml, and the same
      # configure flags -- but NOT the same toolchain, which the earlier wording
      # implied: no compiler is selected here, so this builds with the runner's
      # distribution g++, while the Linux job has shipped from the pinned Clang
      # since ADR-0030. That is deliberate and left alone: CodeQL's C++ alert set
      # comes from its own extractor, not from the compiler's diagnostics, and
      # pinning a compiler here would be a Build System change (dependency set)
      # for no analysis benefit. Corrected 2026-08-31 (ER-CI-03).
      # ANAMORPH_BUILD_NUMBER is irrelevant to analysis.
      - name: Build for analysis (c-cpp manual build mode)
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-linux.sh
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DANAMORPH_BUILD_STANDALONE=OFF
          cmake --build build --target Anamorph_VST3 AnamorphTests

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:${{ matrix.language }}"

      # Persist the raw SARIF this analysis just produced -- IN ADDITION TO, never
      # instead of, the Code Scanning upload performed by the step above. The Code
      # Scanning alert and check-run annotation APIs are not reachable from every
      # audit context; Actions artifacts are, so this keeps the scanner's own
      # output retrievable for later review without changing what is analyzed or
      # what is uploaded.
      #
      # Path: `analyze` writes <database-language>.sarif into its `output`
      # directory, which defaults to `../results` -- i.e. ${{ runner.workspace }}/results,
      # which on this repository's runners is /home/runner/work/Anamorph/results.
      # That default is the action's, not an assumption: the sibling product
      # Anabasis runs the same action and its job log shows "output: ../results"
      # and "Post-processing sarif files: [\"/home/runner/work/Anabasis/results/
      # cpp.sarif\"]" -- the path is workspace-relative, so only the repository
      # name differs here. The glob avoids depending on that reading being exact.
      # The filename is the DATABASE language, not the matrix language: the
      # `c-cpp` entry yields `cpp.sarif`, the `actions` entry `actions.sarif`, so
      # the glob avoids hard-coding that mapping too.
      #
      # `!cancelled()` rather than the default success gate, for the reason
      # CI_CD.md's artifact rules already give: a report Code Scanning REJECTS is
      # exactly when the raw SARIF is most worth keeping, and a success gate would
      # discard it precisely then. `analyze` both writes the SARIF and uploads it,
      # so its own outcome cannot distinguish "no SARIF" from "SARIF written,
      # upload refused" -- hence the two-part condition:
      #   * skipped  -> the build failed and no SARIF exists; stay out of the way
      #                 rather than failing a second time on `if-no-files-found`
      #                 and burying the real error (the trap CI_CD.md's Pipeline
      #                 step 7 documents against the -debug uploads).
      #   * failure  -> the analysis ran; the SARIF is on disk whether or not the
      #                 upload was accepted. Capture it, but do not ALSO fail the
      #                 job if this particular failure was early enough that the
      #                 file never appeared -- hence `warn` rather than `error`.
      #   * success  -> the file must exist; `error` keeps that strict.
      # `warn` never publishes an empty artifact: upload-artifact skips the
      # upload entirely when nothing matches.
      - name: Upload raw CodeQL SARIF
        if: ${{ !cancelled() && steps.analyze.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ matrix.language }}-${{ github.sha }}
          path: ${{ runner.workspace }}/results/*.sarif
          if-no-files-found: ${{ steps.analyze.outcome == 'success' && 'error' || 'warn' }}
