name: Bug report
description: Something in Anamorph behaves incorrectly, crashes, or will not load.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check
        [`docs/KNOWN_ISSUES.md`](../blob/main/docs/KNOWN_ISSUES.md) first — the problem may
        already be a documented limitation with a workaround.

        **There is no log file.** Anamorph writes no diagnostic output, so the fields below are
        what make a report reproducible.

  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What went wrong, and what you expected instead.
      placeholder: |
        Expected: ...
        Actually: ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        The shortest sequence that shows the problem, starting from a freshly inserted instance
        on a new track. If it only happens with a specific preset or session, say so.
      placeholder: |
        1. Insert Anamorph on a mono audio track
        2. Load the "Mono To Stereo" preset
        3. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Anamorph version and build number
      description: >
        Click the ANAMORPH title in the plug-in to open the About screen. It shows
        "Version x.y.z   build N" — please give both.
      placeholder: "Version 0.9.0   build 412"
    validations:
      required: true

  - type: dropdown
    id: format
    attributes:
      label: Plug-in format
      options:
        - VST3
        - AU (macOS only)
        - Standalone application
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows (x86-64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (x86-64)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "Windows 11 24H2 / macOS 15.3 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: daw
    attributes:
      label: DAW and version
      description: >
        Several known issues are host-specific, so the exact version matters. Put "n/a" if you
        are using the Standalone application.
      placeholder: "REAPER 7.22 / Ableton Live 12.1 / Logic Pro 11.1"
    validations:
      required: true

  - type: dropdown
    id: install-route
    attributes:
      label: How did you install it?
      options:
        - Installer (Windows .exe / macOS .pkg / Linux install.sh)
        - Manual — extracted the zip and copied the files myself
        - Built from source
    validations:
      required: true

  - type: input
    id: audio-settings
    attributes:
      label: Sample rate and buffer size
      description: Only needed for audio problems (clicks, dropouts, CPU, latency).
      placeholder: "48 kHz, 256 samples"

  - type: textarea
    id: extra
    attributes:
      label: Screenshots, screen recording, or anything else
      description: >
        Drag files in here. For visual problems a screenshot or short recording is worth far more
        than a description. For a crash, say whether it is reproducible and attach the host's
        crash report if you have one.

  - type: checkboxes
    id: checks
    attributes:
      label: Quick checks
      description: These two account for a large share of reports. Please try them first.
      options:
        - label: I forced a plug-in rescan in my DAW (and cleared any blocklist/failed-scan entry for Anamorph).
        - label: I compared against unprocessed audio (Bypass in the top bar, or Advanced view with Mix at 0 %, where the output is bit-exactly the input).
